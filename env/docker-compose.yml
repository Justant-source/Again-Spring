name: againspring

services:
  mariadb:
    image: mariadb:lts
    container_name: againspring-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - againspring

networks:
  againspring:
    driver: bridge

volumes:
  mariadb_data:
