name: againspring

services:
  mariadb:
    image: mariadb:lts
    container_name: againspring-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - againspring

  againspring-llm:
    build:
      context: ../llm-worker
      dockerfile: Dockerfile
    image: againspring-llm
    container_name: againspring-llm
    environment:
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-claude-sonnet-4-6}
      LLM_POOL_SIZE: ${LLM_POOL_SIZE:-100}
      LLM_QUEUE_CAPACITY: ${LLM_QUEUE_CAPACITY:-500}
      LLM_QUEUE_WAIT_TIMEOUT_MS: ${LLM_QUEUE_WAIT_TIMEOUT_MS:-30000}
      LLM_DEFAULT_TIMEOUT_MS: ${LLM_DEFAULT_TIMEOUT_MS:-120000}
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/root/.claude
    restart: unless-stopped
    networks:
      - againspring
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  againspring:
    driver: bridge
    name: againspring

volumes:
  mariadb_data:
