# 서버 dev 스택 — dev.againspring.net
# 사용: docker compose -f docker-compose.dev.yml up -d --build
# 환경변수: .env.dev 파일 필요 (.env.dev.example 참조)

name: againspring-dev

services:
  mariadb-dev:
    image: mariadb:lts
    container_name: againspring-mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring_dev}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    ports:
      - "3309:3306"    # 로컬 접근용 (3306=local-dev, 3308=greenforest-dev)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - againspring-dev

  backend-dev:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: againspring-backend-dev
    container_name: againspring-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mariadb://againspring-mariadb-dev:3306/${MARIADB_DATABASE:-againspring_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude-code}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/root/.claude
      - ../shared/docs/prompts:/app/shared/docs/prompts:ro
      - ../shared/docs/categories.yml:/app/shared/docs/categories.yml:ro
    depends_on:
      mariadb-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - againspring-dev

  frontend-dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://dev.againspring.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    image: againspring-frontend-dev
    container_name: againspring-frontend-dev
    environment:
      NODE_ENV: production
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - againspring-dev

  nginx-dev:
    image: nginx:alpine
    container_name: againspring-nginx-dev
    ports:
      - "8090:80"    # Cloudflare Tunnel → localhost:8090 → dev.againspring.net
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-dev
      - backend-dev
    restart: unless-stopped
    networks:
      - againspring-dev

networks:
  againspring-dev:
    driver: bridge

volumes:
  mariadb_dev_data:
