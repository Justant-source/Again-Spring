# 서버 dev 스택 — dev.againspring.net
# 사용: docker compose -f docker-compose.dev.yml up -d --build
# 환경변수: .env.dev 파일 필요 (.env.dev.example 참조)

name: againspring-dev

services:
  mariadb-dev:
    image: mariadb:lts
    container_name: againspring-mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring_dev}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    ports:
      - "3309:3306"    # 로컬 접근용 (3306=local-dev, 3308=greenforest-dev)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - againspring-dev

  llm-dev:
    build:
      context: ../llm-worker
      dockerfile: Dockerfile
    image: againspring-llm-dev
    container_name: againspring-llm-dev
    environment:
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-claude-sonnet-4-6}
      LLM_POOL_SIZE: ${LLM_POOL_SIZE:-100}
      LLM_QUEUE_CAPACITY: ${LLM_QUEUE_CAPACITY:-500}
      LLM_QUEUE_WAIT_TIMEOUT_MS: ${LLM_QUEUE_WAIT_TIMEOUT_MS:-30000}
      LLM_DEFAULT_TIMEOUT_MS: ${LLM_DEFAULT_TIMEOUT_MS:-120000}
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/root/.claude
    restart: unless-stopped
    networks:
      - againspring-dev
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  marketing-renderer-dev:
    build:
      context: ../marketing/renderer
      dockerfile: Dockerfile
    image: againspring-marketing-renderer-dev
    container_name: againspring-marketing-renderer-dev
    environment:
      PORT: 9000
      FRONTEND_BASE_URL: http://againspring-frontend-dev:3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m
        reservations:
          memory: 512m
    networks:
      - againspring-dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  social-poster-dev:
    build:
      context: ../marketing/social-poster
      dockerfile: Dockerfile
    image: againspring-social-poster-dev
    container_name: againspring-social-poster-dev
    environment:
      PORT: 9100
    # 핫리로드: src/ 디렉토리를 호스트에서 마운트 — JS 파일 수정 후 restart만으로 반영
    # 재빌드 불필요 (셀렉터 깨짐, 로그인 플로우 변경 등 긴급 대응 시 사용)
    volumes:
      - ../marketing/social-poster/src:/app/src
    command: ["nodemon", "--watch", "src", "src/server.js"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m
        reservations:
          memory: 512m
    networks:
      - againspring-dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  backend-dev:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: againspring-backend-dev
    container_name: againspring-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mariadb://againspring-mariadb-dev:3306/${MARIADB_DATABASE:-againspring_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-remote}
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-remote}
      LLM_REPORT_PROVIDER: ${LLM_REPORT_PROVIDER:-remote}
      LLM_WORKER_URL: ${LLM_WORKER_URL:-http://againspring-llm-dev:8090}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_API_CHAT_MODEL: ${LLM_API_CHAT_MODEL:-claude-haiku-4-5-20251001}
      LLM_API_MAX_CONCURRENCY: ${LLM_API_MAX_CONCURRENCY:-8}
      LLM_API_CACHE_ENABLED: ${LLM_API_CACHE_ENABLED:-true}
      LLM_API_CACHE_TTL: ${LLM_API_CACHE_TTL:-5m}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-againspring2026@gmail.com}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SOCIAL_MASTER_KEY: ${SOCIAL_MASTER_KEY:-}
      SOCIAL_POSTER_URL: ${SOCIAL_POSTER_URL:-http://againspring-social-poster-dev:9100}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-true}
      SOCIAL_WEBHOOK_URL: ${SOCIAL_WEBHOOK_URL:-}
      SOCIAL_EMAIL: ${SOCIAL_EMAIL:-}
    volumes:
      - ../shared/docs/prompts:/app/shared/docs/prompts:ro
      - ../shared/docs/categories.yml:/app/shared/docs/categories.yml:ro
      - ../shared/docs/policies/user-permissions.json:/app/shared/docs/policies/user-permissions.json:ro
      - ../shared/docs/templates:/app/shared/docs/templates:ro
      - marketing_assets_dev:/var/marketing-assets:rw
    depends_on:
      mariadb-dev:
        condition: service_healthy
      llm-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - againspring-dev

  frontend-dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://dev.againspring.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    image: againspring-frontend-dev
    container_name: againspring-frontend-dev
    environment:
      NODE_ENV: production
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - againspring-dev

  nginx-dev:
    image: nginx:alpine
    container_name: againspring-nginx-dev
    ports:
      - "8090:80"    # Cloudflare Tunnel → localhost:8090 → dev.againspring.net
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-dev
      - backend-dev
    restart: unless-stopped
    networks:
      - againspring-dev

networks:
  againspring-dev:
    driver: bridge

volumes:
  mariadb_dev_data:
  marketing_assets_dev:
