# 서버 dev 스택 — dev.againspring.net
# 사용: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
# 환경변수: .env.dev 파일 필요 (.env.dev.example 참조)
# 사전 조건: docker compose up -d (base 스택, againspring-llm 공유 서비스)
# 선택 사항: docker compose -f docker-compose.ai-user.yml --env-file .env.ai-user up -d --build (공통 ai-user 스택)

name: againspring-dev

services:
  mariadb-dev:
    image: mariadb:lts
    container_name: againspring-mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring_dev}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    ports:
      - "3309:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - againspring-dev

  backend-dev:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: againspring-backend-dev
    container_name: againspring-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # server-dev는 prod와 동일하게 Flyway로 스키마 정렬 (local bootRun은 application-dev.yml 그대로)
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DB_URL: jdbc:mariadb://againspring-mariadb-dev:3306/${MARIADB_DATABASE:-againspring_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AS_SECRET_MASTER_KEY: ${AS_SECRET_MASTER_KEY}
      # App secrets (JWT/OAuth/mail/ASM tokens) → encrypted_secret vault only (do not inject empty env)
      LLM_PROVIDER: deny
      LLM_CHAT_PROVIDER: deny
      LLM_REPORT_PROVIDER: deny
      LLM_ENABLED: "false"
      # L3: LLM 워커에 도달 불가한 placeholder (네트워크에서도 againspring 미연결)
      LLM_WORKER_URL: http://127.0.0.1:1
      SECURITY_RATE_LIMIT_AUTH_PER_MINUTE: ${SECURITY_RATE_LIMIT_AUTH_PER_MINUTE:-1000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-againspring2026@gmail.com}
      ASM_BASE_URL: ${ASM_BASE_URL:-http://100.115.252.61:8200}
      ASM_ENABLED: ${ASM_ENABLED:-false}
      ASM_CALLBACK_BASE_URL: ${ASM_CALLBACK_BASE_URL:-http://100.81.189.92:8090}
      # 숏폼 렌더 프로필. marketing_v2 = 새 레이아웃 + 효과음.
      # 이 줄이 없으면 .env 값이 컨테이너에 전달되지 않아 코드 기본값
      # (marketing_fast)이 쓰인다 — 효과음이 통째로 빠지는 원인이었다.
      MARKETING_RENDER_PROFILE: ${MARKETING_RENDER_PROFILE:-marketing_fast}
      # 24h 홀딩 풀 적재 스케줄러. 이게 꺼져 있으면 어드민이 「대기」 탭을
      # 열어야만 새 사연이 풀에 들어가고, 열지 않은 날은 영상 잡이 0건이 된다.
      # 무인 스케줄러라 코드 기본값은 false — 켜는 곳에서 명시한다.
      MARKETING_HOLDING_POOL_REFRESH_ENABLED: ${MARKETING_HOLDING_POOL_REFRESH_ENABLED:-false}
      # L3: shared LLM/ai-user 호스트명 해석 자체를 막음 (againspring 네트워크 미연결)
      AI_LEARNING_URL: http://127.0.0.1:1
      AI_USER_LLM_URL: http://127.0.0.1:1
      AI_USER_ORCHESTRATOR_URL: http://127.0.0.1:1
    volumes:
      - ../docs/shared/prompts:/app/shared/docs/prompts:ro
      - ../docs/shared/categories.yml:/app/shared/docs/categories.yml:ro
      - ../docs/shared/policies/user-permissions.json:/app/shared/docs/policies/user-permissions.json:ro
      - ../docs/shared/templates:/app/shared/docs/templates:ro
    depends_on:
      mariadb-dev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/api/health 2>/dev/null | grep -q 'OK\\|UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - againspring-dev

  frontend-dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://dev.againspring.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${NAVER_SITE_VERIFICATION:-}
    image: againspring-frontend-dev
    container_name: againspring-frontend-dev
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://againspring-backend-dev:8080
    depends_on:
      - backend-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - againspring-dev

  nginx-dev:
    image: nginx:alpine
    container_name: againspring-nginx-dev
    ports:
      - "8090:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # 접근/에러 로그 영속화 (18일치만 남던 docker stdout 순환 소실 방지).
      # 호스트 디렉토리는 미리 justant 소유로 생성해둘 것 — Docker가 자동 생성하면
      # root 소유가 되어 과거 마운트 지점 권한 사고가 재발한다. 로테이션은
      # env/nginx/logrotate.conf(호스트 cron) 참조. docs/env/deployment.md 참고.
      - ./logs/nginx/dev:/var/log/nginx
    depends_on:
      - frontend-dev
      - backend-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - againspring-dev

networks:
  againspring-dev:
    driver: bridge
    name: againspring-dev

volumes:
  mariadb_dev_data:
