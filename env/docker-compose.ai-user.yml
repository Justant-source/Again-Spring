      AI_USER_ENGAGEMENT_COMMENT_LIKE_CAP: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_CAP:-12}
      AI_USER_ENGAGEMENT_REPLY_LIKE_PER_VIEW: ${AI_USER_ENGAGEMENT_REPLY_LIKE_PER_VIEW:-0.40}
      AI_USER_ENGAGEMENT_REPLY_LIKE_CAP: ${AI_USER_ENGAGEMENT_REPLY_LIKE_CAP:-5}
      AI_USER_ENGAGEMENT_PERSONA_POOL_SIZE: ${AI_USER_ENGAGEMENT_PERSONA_POOL_SIZE:-60}
      AI_USER_ENGAGEMENT_COLD_LOGIN_BUDGET: ${AI_USER_ENGAGEMENT_COLD_LOGIN_BUDGET:-3}
      AI_USER_ENGAGEMENT_VOTES_ENABLED: ${AI_USER_ENGAGEMENT_VOTES_ENABLED:-true}
      AI_USER_ENGAGEMENT_VOTE_PER_VIEW: ${AI_USER_ENGAGEMENT_VOTE_PER_VIEW:-0.15}
      AI_USER_ENGAGEMENT_VOTE_CAP: ${AI_USER_ENGAGEMENT_VOTE_CAP:-80}
      AI_USER_ENGAGEMENT_MAX_VOTE_CALLS_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_VOTE_CALLS_PER_RUN:-40}
      AI_USER_ENGAGEMENT_MAX_VOTES_PER_POST_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_VOTES_PER_POST_PER_RUN:-8}
      AI_USER_ENGAGEMENT_VOTE_A_SHARE_MIN: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MIN:-0.44}
      AI_USER_ENGAGEMENT_VOTE_A_SHARE_MAX: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MAX:-0.80}
      AI_USER_ENGAGEMENT_POST_LIKES_ENABLED: ${AI_USER_ENGAGEMENT_POST_LIKES_ENABLED:-true}
      AI_USER_ENGAGEMENT_CRON: "${AI_USER_ENGAGEMENT_CRON:-0 */5 * * * *}"
      AI_USER_PLAN_HARD_TTL_HOURS: ${AI_USER_PLAN_HARD_TTL_HOURS:-24}
      AI_USER_PLAN_RETRY_MAX: ${AI_USER_PLAN_RETRY_MAX:-1}
      AI_USER_POST_REPLAN_MAX: ${AI_USER_POST_REPLAN_MAX:-2}
      AI_USER_POST_EDIT_DEBOUNCE_MINUTES: ${AI_USER_POST_EDIT_DEBOUNCE_MINUTES:-30}
      AI_USER_PREGENERATE_MIN_MINUTES: ${AI_USER_PREGENERATE_MIN_MINUTES:-30}
      AI_USER_PREGENERATE_MAX_MINUTES: ${AI_USER_PREGENERATE_MAX_MINUTES:-90}
      AI_USER_ACTIVITY_LOOKBACK_DAYS: ${AI_USER_ACTIVITY_LOOKBACK_DAYS:-28}
      AI_USER_DAILY_GLOBAL_CAP: ${AI_USER_DEV_DAILY_GLOBAL_CAP:-30}
      AI_USER_BOT_PASSWORD: ${AI_USER_BOT_PASSWORD:-ai-user-prod-pw-2026}
      AI_USER_SEED_ENABLED: true
      AI_USER_REPETITION_THRESHOLD: ${AI_USER_REPETITION_THRESHOLD:-0.45}
      AI_LEARNING_ENABLED: false
      AI_LEARNING_CRAWL_ENABLED: false
      AI_LEARNING_BASE_URL: ${AI_LEARNING_URL:-http://againspring-ai-learning:8099}
      SELF_CRITIQUE_ENABLED: ${SELF_CRITIQUE_ENABLED:-true}
      AI_USER_PERSONA_TARGET: ${AI_USER_PERSONA_TARGET:-50}
      AI_USER_PERSONAS_DIR: /app/personas
      AI_USER_FORCE_ACTIVE: true
      AI_USER_SECONDARY_BACKEND_URL: ""
      PAIRED_POST_ENABLED: false
      PAIRED_POST_CRON: "${PAIRED_POST_CRON:-0 0 */2 * * *}"
      PAIRED_POST_PAIRS: ${PAIRED_POST_PAIRS:-3}
      PAIRED_POST_TARGET_SHARE: ${PAIRED_POST_TARGET_SHARE:-0.20}
      PAIRED_POST_ROMANTIC_SHARE: ${PAIRED_POST_ROMANTIC_SHARE:-0.80}
      AI_USER_ML_ENABLED: false
    volumes:
      - ../ai-user/docs/personas:/app/personas:rw
    restart: unless-stopped
    networks:
      - againspring
      - againspring-dev
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8096/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  prod-dev-sync:
    build:
      context: ../ai-user/sync
      dockerfile: Dockerfile
    image: againspring-prod-dev-sync
    container_name: againspring-prod-dev-sync
    environment:
      PROD_DB_HOST: againspring-mariadb-prod
      PROD_DB_PORT: "3306"
      PROD_DB_USER: ${MARIADB_USER:-againspring}
      PROD_DB_PASSWORD: ${MARIADB_PASSWORD}
      PROD_DB_NAME: ${MARIADB_DATABASE:-againspring}
      DEV_DB_HOST: againspring-mariadb-dev
      DEV_DB_PORT: "3306"
      DEV_DB_USER: ${MARIADB_USER:-againspring}
      DEV_DB_PASSWORD: ${DEV_MARIADB_PASSWORD}
      DEV_DB_NAME: ${DEV_DB_NAME:-againspring_dev}
      SYNC_CRON: ${SYNC_CRON:-30 5 * * *}
      SYNC_CONTENT_CRON: ${SYNC_CONTENT_CRON:-*/5 * * * *}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Asia/Seoul}
      SYNC_BACKFILL_DAYS: ${SYNC_BACKFILL_DAYS:-7}
      SYNC_CONTENT_LOOKBACK_MINUTES: ${SYNC_CONTENT_LOOKBACK_MINUTES:-15}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pidof", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - againspring-prod
      - againspring-dev

networks:
  againspring:
    external: true
    name: againspring
  againspring-prod:
    external: true
    name: againspring-prod
  againspring-dev:
    external: true
    name: againspring-dev
