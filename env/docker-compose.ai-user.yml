# 공통 ai-user 스택 — dev/prod 공용
# 사용: docker compose -f docker-compose.ai-user.yml --env-file .env.ai-user up -d --build
# 환경변수: .env.ai-user 파일 필요 (.env.ai-user.example 참조)
# 사전 조건:
#   1) docker compose up -d (base 스택, againspring-llm)
#   2) docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   3) docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build (prod→dev sync 사용 시)

name: againspring-ai-user

services:
  llm-ai-user:
    build:
      context: ../ai-user/llm
      dockerfile: Dockerfile
    image: againspring-llm-ai-user
    container_name: againspring-llm-ai-user
    user: "1000:1000"
    environment:
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CODEX_BIN: ${CODEX_BIN:-codex}
      CLAUDE_MODEL: ${AI_USER_LLM_MODEL:-claude-haiku-4-5-20251001}
      LLM_POST_MODEL: ${LLM_POST_MODEL:-claude-sonnet-4-6}
      AI_POST_CLAUDE_MODEL: ${AI_POST_CLAUDE_MODEL:-claude-sonnet-4-6}
      AI_POST_CODEX_MODEL: ${AI_POST_CODEX_MODEL:-gpt-5.6-terra}
      AI_INTERACTION_CLAUDE_MODEL: ${AI_INTERACTION_CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      AI_INTERACTION_CODEX_MODEL: ${AI_INTERACTION_CODEX_MODEL:-gpt-5.6-luna}
      AI_USER_CLAUDE_POOL_SIZE: ${AI_USER_CLAUDE_POOL_SIZE:-4}
      AI_USER_CODEX_POOL_SIZE: ${AI_USER_CODEX_POOL_SIZE:-4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_POOL_SIZE: ${AI_USER_LLM_POOL_SIZE:-20}
      LLM_QUEUE_CAPACITY: ${AI_USER_LLM_QUEUE_CAPACITY:-100}
      LLM_QUEUE_WAIT_TIMEOUT_MS: ${AI_USER_LLM_QUEUE_WAIT_TIMEOUT_MS:-30000}
      LLM_DEFAULT_TIMEOUT_MS: ${AI_USER_LLM_DEFAULT_TIMEOUT_MS:-600000}
      SELF_CRITIQUE_ENABLED: ${SELF_CRITIQUE_ENABLED:-true}
      SELF_CRITIQUE_THRESHOLD: ${SELF_CRITIQUE_THRESHOLD:-5}
      SELF_CRITIQUE_EXTRA_CLICHES: ${SELF_CRITIQUE_EXTRA_CLICHES:-}
      LLM_API_REFUSAL_RETRIES: ${LLM_API_REFUSAL_RETRIES:-0}
      LLM_API_REFUSAL_FALLBACK_MODEL: ${LLM_API_REFUSAL_FALLBACK_MODEL:-}
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      HOME: /home/justant
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/home/justant/.claude
      - ${CODEX_HOST_CONFIG_DIR:-/home/justant/.codex}:/home/justant/.codex
    restart: unless-stopped
    networks:
      - againspring
      - againspring-prod
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8092/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai-learning:
    build:
      context: ../ai-user/learning
      dockerfile: Dockerfile
    image: againspring-ai-learning
    container_name: againspring-ai-learning
    environment:
      DB_HOST: againspring-mariadb-prod
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-againspring}
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-true}
      AI_LEARNING_CRAWL_ENABLED: ${AI_LEARNING_CRAWL_ENABLED:-false}
      CRAWL_MIN_POPULARITY_PCT: ${CRAWL_MIN_POPULARITY_PCT:-0.50}
      LLM_AI_USER_URL: ${LLM_AI_USER_URL:-http://againspring-llm-ai-user:8092}
    ports:
      - "8099:8099"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3000m
        reservations:
          memory: 512m
    networks:
      - againspring
      - againspring-prod
    healthcheck:
      # 크롤/임베딩 중 GIL·CPU 포화로 응답이 밀릴 수 있음 — timeout/retries 여유.
      # ops-watchdog는 크롤 중(마커·KST 02–03시) ai-learning 재시작을 건너뛴다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=25)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

  ai-user-orchestrator:
    build:
      context: ../ai-user/orchestrator
      dockerfile: Dockerfile
    image: againspring-ai-user-orchestrator
    container_name: againspring-ai-user-orchestrator
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      BACKEND_BASE_URL: ${AI_USER_BACKEND_URL:-http://againspring-backend-prod:8080}
      LLM_AI_USER_URL: ${LLM_AI_USER_URL:-http://againspring-llm-ai-user:8092}
      AI_USER_ENABLED: ${AI_USER_ENABLED:-true}
      AI_USER_TICK_CRON: "${AI_USER_TICK_CRON:-0 */10 * * * *}"
      AI_USER_MODE: ${AI_USER_MODE:-LEGACY}
      AI_USER_HUMAN_BATCH_CRON: "${AI_USER_HUMAN_BATCH_CRON:-0 */30 * * * *}"
      AI_USER_DUE_ITEM_CRON: "${AI_USER_DUE_ITEM_CRON:-*/30 * * * * *}"
      AI_USER_THREAD_PLAN_ENABLED: ${AI_USER_THREAD_PLAN_ENABLED:-false}
      AI_USER_THREAD_PLAN_PUBLISHER_ENABLED: ${AI_USER_THREAD_PLAN_PUBLISHER_ENABLED:-false}
      AI_USER_THREAD_PLAN_BUNDLE_TIMEOUT_MS: ${AI_USER_THREAD_PLAN_BUNDLE_TIMEOUT_MS:-600000}
      AI_USER_THREAD_PLAN_MICRO_BATCH_ENABLED: ${AI_USER_THREAD_PLAN_MICRO_BATCH_ENABLED:-true}
      AI_USER_THREAD_PLAN_MICRO_BATCH_SIZE: ${AI_USER_THREAD_PLAN_MICRO_BATCH_SIZE:-5}
      AI_USER_THREAD_PLAN_PLAN_PERSONA_CAST_MAX: ${AI_USER_THREAD_PLAN_PLAN_PERSONA_CAST_MAX:-40}
      AI_USER_HUMAN_REPLY_BATCH_ENABLED: ${AI_USER_HUMAN_REPLY_BATCH_ENABLED:-false}
      AI_USER_HUMAN_REPLY_CHUNK_SIZE: ${AI_USER_HUMAN_REPLY_CHUNK_SIZE:-20}
      AI_USER_HUMAN_REPLY_RESPONDERS_MIN: ${AI_USER_HUMAN_REPLY_RESPONDERS_MIN:-0}
      AI_USER_HUMAN_REPLY_RESPONDERS_MAX: ${AI_USER_HUMAN_REPLY_RESPONDERS_MAX:-3}
      AI_USER_HUMAN_REPLY_DISTINCT_PERSONAS_MAX: ${AI_USER_HUMAN_REPLY_DISTINCT_PERSONAS_MAX:-3}
      AI_USER_HUMAN_REPLY_PER_PERSONA_MAX: ${AI_USER_HUMAN_REPLY_PER_PERSONA_MAX:-5}
      AI_USER_HUMAN_REPLY_PER_POST_MAX: ${AI_USER_HUMAN_REPLY_PER_POST_MAX:-15}
      AI_USER_HUMAN_REPLY_CANDIDATE_MAX: ${AI_USER_HUMAN_REPLY_CANDIDATE_MAX:-8}
      AI_USER_HUMAN_REPLY_DELAY_MINUTES_MIN: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MIN:-1}
      AI_USER_HUMAN_REPLY_DELAY_MINUTES_MAX: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MAX:-30}
      AI_USER_HUMAN_REPLY_INBOX_TTL_DAYS: ${AI_USER_HUMAN_REPLY_INBOX_TTL_DAYS:-7}
      AI_USER_HUMAN_REPLY_PLAN_TTL_DAYS: ${AI_USER_HUMAN_REPLY_PLAN_TTL_DAYS:-7}
      AI_USER_HUMAN_REPLY_TTL_CLEANUP_ENABLED: ${AI_USER_HUMAN_REPLY_TTL_CLEANUP_ENABLED:-false}
      AI_USER_MATCHER_AUTHOR_THRESHOLD: ${AI_USER_MATCHER_AUTHOR_THRESHOLD:-0.35}
      AI_USER_SCHEDULED_POST_PUBLISHER_ENABLED: ${AI_USER_SCHEDULED_POST_PUBLISHER_ENABLED:-false}
      AI_USER_SCHEDULED_POST_PUBLISHER_CRON: "${AI_USER_SCHEDULED_POST_PUBLISHER_CRON:-0 * * * * *}"
      AI_USER_SCHEDULED_POST_PUBLISH_BATCH_SIZE: ${AI_USER_SCHEDULED_POST_PUBLISH_BATCH_SIZE:-5}
      AI_USER_POST_SLOT_MIN_SPACING_MINUTES: ${AI_USER_POST_SLOT_MIN_SPACING_MINUTES:-45}
      AI_USER_ENGAGEMENT_ENABLED: ${AI_USER_ENGAGEMENT_ENABLED:-false}
      AI_USER_ENGAGEMENT_LOOKBACK_DAYS: ${AI_USER_ENGAGEMENT_LOOKBACK_DAYS:-3}
      AI_USER_ENGAGEMENT_MAX_POSTS_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_POSTS_PER_RUN:-40}
      AI_USER_ENGAGEMENT_MAX_LIKE_CALLS_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_LIKE_CALLS_PER_RUN:-500}
      AI_USER_ENGAGEMENT_VIEWS_ENABLED: ${AI_USER_ENGAGEMENT_VIEWS_ENABLED:-true}
      AI_USER_ENGAGEMENT_POST_LIKE_PER_VIEW: ${AI_USER_ENGAGEMENT_POST_LIKE_PER_VIEW:-0.02}
      AI_USER_ENGAGEMENT_POST_LIKE_PER_COMMENT: ${AI_USER_ENGAGEMENT_POST_LIKE_PER_COMMENT:-0.6}
      AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_VIEW: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_VIEW:-0.75}
      AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_REPLY: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_REPLY:-1.0}
      AI_USER_ENGAGEMENT_COMMENT_LIKE_CAP: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_CAP:-12}
      AI_USER_ENGAGEMENT_REPLY_LIKE_PER_VIEW: ${AI_USER_ENGAGEMENT_REPLY_LIKE_PER_VIEW:-0.40}
      AI_USER_ENGAGEMENT_REPLY_LIKE_CAP: ${AI_USER_ENGAGEMENT_REPLY_LIKE_CAP:-5}
      AI_USER_ENGAGEMENT_PERSONA_POOL_SIZE: ${AI_USER_ENGAGEMENT_PERSONA_POOL_SIZE:-60}
      AI_USER_ENGAGEMENT_COLD_LOGIN_BUDGET: ${AI_USER_ENGAGEMENT_COLD_LOGIN_BUDGET:-3}
      AI_USER_ENGAGEMENT_VOTES_ENABLED: ${AI_USER_ENGAGEMENT_VOTES_ENABLED:-true}
      AI_USER_ENGAGEMENT_VOTE_PER_VIEW: ${AI_USER_ENGAGEMENT_VOTE_PER_VIEW:-0.15}
      AI_USER_ENGAGEMENT_VOTE_CAP: ${AI_USER_ENGAGEMENT_VOTE_CAP:-80}
      AI_USER_ENGAGEMENT_MAX_VOTE_CALLS_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_VOTE_CALLS_PER_RUN:-40}
      AI_USER_ENGAGEMENT_MAX_VOTES_PER_POST_PER_RUN: ${AI_USER_ENGAGEMENT_MAX_VOTES_PER_POST_PER_RUN:-8}
      AI_USER_ENGAGEMENT_VOTE_A_SHARE_MIN: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MIN:-0.44}
      AI_USER_ENGAGEMENT_VOTE_A_SHARE_MAX: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MAX:-0.80}
      AI_USER_ENGAGEMENT_POST_LIKES_ENABLED: ${AI_USER_ENGAGEMENT_POST_LIKES_ENABLED:-true}
      AI_USER_ENGAGEMENT_CRON: "${AI_USER_ENGAGEMENT_CRON:-0 */5 * * * *}"
      AI_USER_PLAN_HARD_TTL_HOURS: ${AI_USER_PLAN_HARD_TTL_HOURS:-24}
      AI_USER_PLAN_RETRY_MAX: ${AI_USER_PLAN_RETRY_MAX:-1}
      AI_USER_POST_REPLAN_MAX: ${AI_USER_POST_REPLAN_MAX:-2}
      AI_USER_POST_EDIT_DEBOUNCE_MINUTES: ${AI_USER_POST_EDIT_DEBOUNCE_MINUTES:-30}
      AI_USER_PREGENERATE_MIN_MINUTES: ${AI_USER_PREGENERATE_MIN_MINUTES:-30}
      AI_USER_PREGENERATE_MAX_MINUTES: ${AI_USER_PREGENERATE_MAX_MINUTES:-90}
      AI_USER_ACTIVITY_LOOKBACK_DAYS: ${AI_USER_ACTIVITY_LOOKBACK_DAYS:-28}
      AI_USER_DAILY_GLOBAL_CAP: ${AI_USER_DAILY_GLOBAL_CAP:-500}
      AI_USER_BOT_PASSWORD: ${AI_USER_BOT_PASSWORD:-ai-user-prod-pw-2026}
      AI_USER_SEED_ENABLED: ${AI_USER_SEED_ENABLED:-true}
      AI_USER_REPETITION_THRESHOLD: ${AI_USER_REPETITION_THRESHOLD:-0.45}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-true}
      # learning APScheduler owns daily crawl (02:00 KST); do not dual-trigger from orchestrator
      AI_LEARNING_CRAWL_ENABLED: "false"
      AI_LEARNING_BASE_URL: ${AI_LEARNING_URL:-http://againspring-ai-learning:8099}
      SELF_CRITIQUE_ENABLED: ${SELF_CRITIQUE_ENABLED:-true}
      AI_USER_PERSONA_TARGET: ${AI_USER_PERSONA_TARGET:-50}
      AI_USER_PERSONAS_DIR: /app/personas
      AI_USER_FORCE_ACTIVE: ${AI_USER_FORCE_ACTIVE:-false}
      AI_USER_SECONDARY_BACKEND_URL: ${AI_USER_SECONDARY_BACKEND_URL:-}
      PAIRED_POST_ENABLED: ${PAIRED_POST_ENABLED:-true}
      PAIRED_POST_CRON: "${PAIRED_POST_CRON:-0 0 */2 * * *}"
      PAIRED_POST_PAIRS: ${PAIRED_POST_PAIRS:-3}
      PAIRED_POST_TARGET_SHARE: ${PAIRED_POST_TARGET_SHARE:-0.20}
      PAIRED_POST_ROMANTIC_SHARE: ${PAIRED_POST_ROMANTIC_SHARE:-0.80}
      AI_USER_ML_BASE_URL: ${AI_USER_ML_BASE_URL:-http://100.115.252.61:8201}
      AI_USER_ML_ENABLED: ${AI_USER_ML_ENABLED:-false}
      AI_USER_ML_ENABLED_COMMUNITIES: ${AI_USER_ML_ENABLED_COMMUNITIES:-}
      AI_USER_ML_API_TOKEN: ${AI_USER_ML_API_TOKEN:-aiuser-ml-api-token-dev-2026}
      AI_USER_ML_COLLECT: ${AI_USER_ML_COLLECT:-false}
      AI_USER_ML_BEST_OF_N: ${AI_USER_ML_BEST_OF_N:-4}
      AI_USER_ML_TIMEOUT_MS: ${AI_USER_ML_TIMEOUT_MS:-500}
    volumes:
      - ../ai-user/docs/personas:/app/personas:rw
    restart: unless-stopped
    networks:
      - againspring
      - againspring-prod
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8096/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  ai-user-orchestrator-dev:
    # L3: 기본 기동 금지. 명시 시에만: --profile ai-user-dev
    profiles: ["ai-user-dev"]
    build:
      context: ../ai-user/orchestrator
      dockerfile: Dockerfile
    image: againspring-ai-user-orchestrator-dev
    container_name: againspring-ai-user-orchestrator-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mariadb://againspring-mariadb-dev:3306/${DEV_DB_NAME:-againspring_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${DEV_MARIADB_PASSWORD}
      BACKEND_BASE_URL: http://againspring-backend-dev:8080
      LLM_AI_USER_URL: ${LLM_AI_USER_URL:-http://againspring-llm-ai-user:8092}
      AI_USER_ENABLED: ${AI_USER_DEV_ENABLED:-false}
      AI_USER_TICK_CRON: "${AI_USER_TICK_CRON:-0 */10 * * * *}"
      AI_USER_MODE: LEGACY
      AI_USER_HUMAN_BATCH_CRON: "${AI_USER_HUMAN_BATCH_CRON:-0 */30 * * * *}"
      AI_USER_DUE_ITEM_CRON: "${AI_USER_DUE_ITEM_CRON:-*/30 * * * * *}"
      AI_USER_THREAD_PLAN_ENABLED: true
      AI_USER_THREAD_PLAN_PUBLISHER_ENABLED: true
      AI_USER_THREAD_PLAN_BUNDLE_TIMEOUT_MS: ${AI_USER_THREAD_PLAN_BUNDLE_TIMEOUT_MS:-600000}
      AI_USER_THREAD_PLAN_MICRO_BATCH_ENABLED: ${AI_USER_THREAD_PLAN_MICRO_BATCH_ENABLED:-true}
      AI_USER_THREAD_PLAN_MICRO_BATCH_SIZE: ${AI_USER_THREAD_PLAN_MICRO_BATCH_SIZE:-5}
      AI_USER_THREAD_PLAN_PLAN_PERSONA_CAST_MAX: ${AI_USER_THREAD_PLAN_PLAN_PERSONA_CAST_MAX:-40}
      AI_USER_HUMAN_REPLY_BATCH_ENABLED: true
      AI_USER_HUMAN_REPLY_CHUNK_SIZE: ${AI_USER_HUMAN_REPLY_CHUNK_SIZE:-20}
      AI_USER_HUMAN_REPLY_RESPONDERS_MIN: ${AI_USER_HUMAN_REPLY_RESPONDERS_MIN:-0}
      AI_USER_HUMAN_REPLY_RESPONDERS_MAX: ${AI_USER_HUMAN_REPLY_RESPONDERS_MAX:-3}
      AI_USER_HUMAN_REPLY_DISTINCT_PERSONAS_MAX: ${AI_USER_HUMAN_REPLY_DISTINCT_PERSONAS_MAX:-3}
      AI_USER_HUMAN_REPLY_PER_PERSONA_MAX: ${AI_USER_HUMAN_REPLY_PER_PERSONA_MAX:-5}
      AI_USER_HUMAN_REPLY_PER_POST_MAX: ${AI_USER_HUMAN_REPLY_PER_POST_MAX:-15}
      AI_USER_HUMAN_REPLY_CANDIDATE_MAX: ${AI_USER_HUMAN_REPLY_CANDIDATE_MAX:-8}
      AI_USER_HUMAN_REPLY_DELAY_MINUTES_MIN: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MIN:-1}
      AI_USER_HUMAN_REPLY_DELAY_MINUTES_MAX: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MAX:-30}
      AI_USER_HUMAN_REPLY_INBOX_TTL_DAYS: ${AI_USER_HUMAN_REPLY_INBOX_TTL_DAYS:-7}
      AI_USER_HUMAN_REPLY_PLAN_TTL_DAYS: ${AI_USER_HUMAN_REPLY_PLAN_TTL_DAYS:-7}
      AI_USER_HUMAN_REPLY_TTL_CLEANUP_ENABLED: ${AI_USER_HUMAN_REPLY_TTL_CLEANUP_ENABLED:-false}
      AI_USER_MATCHER_AUTHOR_THRESHOLD: ${AI_USER_MATCHER_AUTHOR_THRESHOLD:-0.35}
      AI_USER_SCHEDULED_POST_PUBLISHER_ENABLED: ${AI_USER_SCHEDULED_POST_PUBLISHER_ENABLED:-false}
      AI_USER_SCHEDULED_POST_PUBLISHER_CRON: "${AI_USER_SCHEDULED_POST_PUBLISHER_CRON:-0 * * * * *}"
      AI_USER_SCHEDULED_POST_PUBLISH_BATCH_SIZE: ${AI_USER_SCHEDULED_POST_PUBLISH_BATCH_SIZE:-5}
      AI_USER_POST_SLOT_MIN_SPACING_MINUTES: ${AI_USER_POST_SLOT_MIN_SPACING_MINUTES:-45}
      AI_USER_ENGAGEMENT_ENABLED: ${AI_USER_ENGAGEMENT_ENABLED:-false}
