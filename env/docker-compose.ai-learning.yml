# AI Learning 공용 서비스 -- dev/prod 공유 단일 인스턴스
# 사용: docker compose -f docker-compose.ai-learning.yml --env-file .env.ai-learning up -d --build
# dev/prod 모두 이 서비스를 공유 (한 번만 실행)
name: againspring-ai-learning

services:
  ai-learning-db:
    image: pgvector/pgvector:pg16
    container_name: againspring-ai-learning-db
    environment:
      POSTGRES_USER: ailearning
      POSTGRES_PASSWORD: ${AI_LEARNING_DB_PASSWORD:-ailearning-pw-2026}
      POSTGRES_DB: ailearning
    volumes:
      - ai_learning_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailearning -d ailearning"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - againspring-ai

  ai-learning:
    build:
      context: ../ai-learning
      dockerfile: Dockerfile
    image: againspring-ai-learning
    container_name: againspring-ai-learning
    environment:
      DATABASE_URL: postgresql://ailearning:${AI_LEARNING_DB_PASSWORD:-ailearning-pw-2026}@ai-learning-db:5432/ailearning
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-true}
    depends_on:
      ai-learning-db:
        condition: service_healthy
    ports:
      - "8099:8099"
    restart: unless-stopped
    networks:
      - againspring-ai
      - againspring-dev
      - againspring-prod

networks:
  againspring-ai:
    driver: bridge
  againspring-dev:
    external: true
    name: againspring-dev_againspring-dev
  againspring-prod:
    external: true
    name: againspring-prod_againspring-prod

volumes:
  ai_learning_db_data:
