server {
    listen 80;
    server_name dev.againspring.net;

    client_max_body_size 10M;

    # 마케팅 API — LLM 2회 호출(익명화+재시도)로 최대 120s 소요
    location /api/admin/marketing/ {
        proxy_pass         http://againspring-backend-dev:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # API → Spring Boot backend
    location /api/ {
        proxy_pass         http://againspring-backend-dev:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://againspring-backend-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://againspring-backend-dev:8080;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://againspring-backend-dev:8080;
        proxy_set_header Host $host;
    }

    # Frontend → Next.js (with WebSocket support for HMR if needed)
    location / {
        proxy_pass         http://againspring-frontend-dev:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
