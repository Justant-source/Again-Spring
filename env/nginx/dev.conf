server {
    listen 80;
    server_name dev.againspring.net;

    client_max_body_size 10M;

    # Docker 임베디드 DNS로 업스트림 IP를 런타임마다 재해석.
    # 백엔드/프론트 컨테이너가 재생성되며 IP가 바뀌어도 nginx 재시작 없이 따라간다 (502 방지).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_dev      againspring-backend-dev;
    set $frontend_dev     againspring-frontend-dev;

    # HTTP → HTTPS 강제 (방문자 보안 컨텍스트 보장).
    # cloudflared가 방문자 원본 scheme을 X-Forwarded-Proto로 전달 (https 방문자=https → 미리다이렉트, 루프 없음).
    # nginx는 80만 listen하므로 $scheme은 항상 http → 절대 사용 금지(루프). 직접 origin 헬스체크는
    # 이 헤더가 없어 영향 없음. 카카오톡 등이 http로 열어도 https로 올려 crypto.randomUUID 등 복구.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 마케팅 API — LLM 2회 호출(익명화+재시도)로 최대 120s 소요
    location /api/admin/marketing/ {
        proxy_pass         http://$backend_dev:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # API → Spring Boot backend
    location /api/ {
        proxy_pass         http://$backend_dev:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://$backend_dev:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://$backend_dev:8080$request_uri;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://$backend_dev:8080$request_uri;
        proxy_set_header Host $host;
    }

    # Frontend → Next.js (with WebSocket support for HMR if needed)
    location / {
        proxy_pass         http://$frontend_dev:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
