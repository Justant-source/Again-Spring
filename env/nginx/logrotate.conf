# 다시봄 nginx 접근/에러 로그 로테이션 (dev/prod)
#
# 배경: prod nginx 로그가 docker stdout에만 남아 18일치만 존재 → 유입 개선 효과를
# 주 단위로 비교할 수 없었다. env/docker-compose.{dev,prod}.yml의 nginx 서비스에
# ./logs/nginx/{dev,prod} → /var/log/nginx bind mount를 추가해 파일로 영속화하고,
# 이 설정으로 90일 보존 + 압축한다 (주간 비교 + 분기 회고 가능).
#
# 왜 사이드카 컨테이너가 아니라 호스트 cron인가:
#   - 이 프로젝트는 이미 justant 사용자 crontab으로 주기 작업을 돌리는 관행이 있다
#     (env/scripts/nightly-ai-user-batch.sh, ops-watchdog.sh 등 — docs/env/watchdog.md).
#   - 호스트에는 이미 logrotate(및 systemd logrotate.timer)가 설치돼 있다. 별도
#     이미지/서비스/헬스체크/네트워크 연결이 필요한 사이드카 컨테이너보다 설정
#     파일 하나 + crontab 한 줄이 훨씬 단순하고 장애 지점이 적다.
#   - rename(회전) + 압축 + 오래된 파일 삭제는 전부 "디렉토리 쓰기 권한"만
#     있으면 되고(unlink/rename에는 파일 소유권이 필요 없다) 로그 파일 자체는
#     컨테이너 root가 만들어도 문제 없다. 유일하게 필요한 루트 권한은 nginx
#     프로세스에게 "새 로그 파일 열기"를 알리는 SIGUSR1 뿐인데, 이건
#     `docker kill`(docker 그룹 권한)로 충분해 sudo/root cron이 전혀 필요 없다.
#
# 적용 방법 (사용자가 직접 실행 — 이 세션은 설정만 준비하고 배포/등록은 하지 않는다):
#   1) crontab -e 로 justant 사용자 crontab에 아래 한 줄 추가 (매일 새벽 4시 5분):
#        5 4 * * * /usr/sbin/logrotate -s /home/justant/.local/state/again-spring-nginx-logrotate.status /home/justant/Data/Again-Spring/env/nginx/logrotate.conf >> /home/justant/Data/Again-Spring/env/logs/nginx-logrotate.cron.log 2>&1
#      (-s 로 상태 파일을 홈 디렉토리 아래에 두는 이유: 기본 경로 /var/lib/logrotate/status는
#       root 소유라 일반 사용자 cron에서 쓸 수 없다.)
#   2) mkdir -p /home/justant/.local/state
#   3) 최초 1회 수동 실행으로 문법 확인:
#        /usr/sbin/logrotate -d -s /home/justant/.local/state/again-spring-nginx-logrotate.status \
#          /home/justant/Data/Again-Spring/env/nginx/logrotate.conf   # -d = dry-run
#
# 전제: env/docker-compose.{dev,prod}.yml의 nginx 서비스가 이미
# ./logs/nginx/{dev,prod}:/var/log/nginx 로 떠 있어야 한다 (컨테이너 재생성 필요 —
# 볼륨 항목 추가는 compose 설정 자체가 바뀌므로 `docker compose up -d`만으로도
# 재생성이 감지된다. 다만 *.conf 파일 하나만 고쳐 내용만 바꾼 경우는 별개 —
# 단일 파일 mount는 내용 변경을 compose가 감지하지 못해 --force-recreate가 필요하다).

/home/justant/Data/Again-Spring/env/logs/nginx/prod/*.log {
    daily
    rotate 90
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        docker kill -s USR1 againspring-nginx-prod > /dev/null 2>&1 || true
    endscript
}

/home/justant/Data/Again-Spring/env/logs/nginx/dev/*.log {
    daily
    rotate 90
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        docker kill -s USR1 againspring-nginx-dev > /dev/null 2>&1 || true
    endscript
}
