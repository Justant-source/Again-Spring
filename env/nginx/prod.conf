server {
    listen 80;
    server_name againspring.net www.againspring.net;

    client_max_body_size 10M;

    # Cloudflare Real IP 복원
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Docker 임베디드 DNS로 업스트림 IP를 런타임마다 재해석.
    # 백엔드/프론트 컨테이너가 재생성되며 IP가 바뀌어도 nginx 재시작 없이 따라간다 (502 방지).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_prod  againspring-backend-prod;
    set $frontend_prod againspring-frontend-prod;

    # API → Spring Boot backend
    location /api/ {
        proxy_pass         http://$backend_prod:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://$backend_prod:8080$request_uri;
        proxy_set_header Host $host;
    }

    # Frontend → Next.js
    location / {
        proxy_pass         http://$frontend_prod:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
