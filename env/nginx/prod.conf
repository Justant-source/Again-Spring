server {
    listen 80;
    server_name againspring.net www.againspring.net;

    client_max_body_size 10M;

    # Cloudflare Real IP 복원
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Docker 임베디드 DNS로 업스트림 IP를 런타임마다 재해석.
    # 백엔드/프론트 컨테이너가 재생성되며 IP가 바뀌어도 nginx 재시작 없이 따라간다 (502 방지).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_prod  againspring-backend-prod;
    set $frontend_prod againspring-frontend-prod;

    # HTTP → HTTPS 강제 (방문자 보안 컨텍스트 보장).
    # cloudflared가 방문자 원본 scheme을 X-Forwarded-Proto로 전달 (https 방문자=https → 미리다이렉트, 루프 없음).
    # nginx는 80만 listen하므로 $scheme은 항상 http → 절대 사용 금지(루프). 직접 origin 헬스체크는
    # 이 헤더가 없어 영향 없음. 카카오톡 등이 http로 열어도 https로 올려 crypto.randomUUID 등 복구.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 마케팅 API — LLM·통계 수집 등 장시간 작업 (동기 경로 잔여 대비)
    location /api/admin/marketing/ {
        proxy_pass         http://$backend_prod:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 내부 전용 채널(orchestrator → backend) — 외부(nginx) 경유 접근 차단, 컨테이너 네트워크 직결만 허용
    # 주의: /api/internal/marketing/(ASM callback/redrive)는 외부(ASM 호스트)에서 이 nginx를 거쳐
    # 실제로 호출되므로 여기서 막지 않는다 — ai-user 경로만 차단.
    location /api/internal/ai-user/ {
        return 404;
    }

    # API → Spring Boot backend
    location /api/ {
        proxy_pass         http://$backend_prod:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://$backend_prod:8080$request_uri;
        proxy_set_header Host $host;
    }

    # Frontend → Next.js
    location / {
        proxy_pass         http://$frontend_prod:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
