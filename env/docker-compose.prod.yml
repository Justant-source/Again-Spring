# 서버 prod 스택 — againspring.net / www.againspring.net
# 사용: docker compose -f docker-compose.prod.yml up -d --build
# 환경변수: .env.prod 파일 필요 (.env.prod.example 참조)
# ⚠️ 주의: 명시적 배포 요청 없이 절대 실행 금지
# 사전 조건: docker compose up -d (base 스택, againspring-llm 공유 서비스)

name: againspring-prod

services:
  mariadb-prod:
    image: mariadb:lts
    container_name: againspring-mariadb-prod
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
      - --max-connections=200
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    # 외부 포트 노출 없음 (internal only)
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - againspring-prod

  backend-prod:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: againspring-backend-prod
    container_name: againspring-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-remote}
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-remote}
      LLM_REPORT_PROVIDER: ${LLM_REPORT_PROVIDER:-remote}
      LLM_JURY_PROVIDER: ${LLM_JURY_PROVIDER:-remote}
      LLM_WORKER_URL: ${LLM_WORKER_URL:-http://againspring-llm:8090}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-againspring2026@gmail.com}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      ASM_BASE_URL: ${ASM_BASE_URL:-}
      ASM_API_TOKEN: ${ASM_API_TOKEN:-}
      ASM_ENABLED: ${ASM_ENABLED:-false}
      AI_USER_LLM_URL: http://againspring-llm-ai-user-prod:8092
      AI_USER_ORCHESTRATOR_URL: http://againspring-ai-user-orchestrator-prod:8096
    volumes:
      - ../shared/docs/prompts:/app/shared/docs/prompts:ro
      - ../shared/docs/categories.yml:/app/shared/docs/categories.yml:ro
      - ../shared/docs/policies/user-permissions.json:/app/shared/docs/policies/user-permissions.json:ro
      - ../shared/docs/templates:/app/shared/docs/templates:ro
    depends_on:
      mariadb-prod:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    networks:
      - againspring-prod
      - againspring

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://againspring.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
    image: againspring-frontend-prod
    container_name: againspring-frontend-prod
    environment:
      NODE_ENV: production
      # 서버사이드 OG fetch 용 — Next.js 서버에서 내부 Docker 네트워크로 백엔드 직접 호출
      BACKEND_INTERNAL_URL: http://againspring-backend-prod:8080
    depends_on:
      - backend-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - againspring-prod

  llm-ai-user-prod:
    build:
      context: ../ai-user/llm
      dockerfile: Dockerfile
    image: againspring-llm-ai-user-prod
    container_name: againspring-llm-ai-user-prod
    environment:
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MODEL: ${AI_USER_LLM_MODEL:-claude-haiku-4-5-20251001}
      # 글(POST)만 Sonnet 승격 (문체 현실화 S5). 빈 값=CLAUDE_MODEL(haiku) 폴백.
      # 2026-06-11: sonnet 절단은 OutputSanitizer "---" 삭제가 sonnet의 제목-본문 구분을 파괴한 것이 원인
      #   (OutputSanitizerHrTest로 수정). lengthTier·MAX_POST를 backend 1000자에 맞추고 최소길이 가드 추가 후 재승격.
      LLM_POST_MODEL: ${LLM_POST_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_POOL_SIZE: ${AI_USER_LLM_POOL_SIZE:-20}
      LLM_QUEUE_CAPACITY: ${AI_USER_LLM_QUEUE_CAPACITY:-100}
      LLM_DEFAULT_TIMEOUT_MS: ${AI_USER_LLM_DEFAULT_TIMEOUT_MS:-120000}
      SELF_CRITIQUE_ENABLED: ${SELF_CRITIQUE_ENABLED:-true}
      SELF_CRITIQUE_EXTRA_CLICHES: ${SELF_CRITIQUE_EXTRA_CLICHES:-}
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/root/.claude
    depends_on:
      mariadb-prod:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - againspring-prod
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8092/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai-learning-prod:
    build:
      context: ../ai-user/learning
      dockerfile: Dockerfile
    image: againspring-ai-learning-prod
    container_name: againspring-ai-learning-prod
    environment:
      DB_HOST: againspring-mariadb-prod
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:-againspring}
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AI_LEARNING_CRAWL_ENABLED: ${AI_LEARNING_CRAWL_ENABLED:-false}
      # persona_strengthener의 LLM 분석용 — 미설정 시 잘못된 기본값(-dev 접미사)으로 silent 실패했음
      LLM_AI_USER_URL: http://againspring-llm-ai-user-prod:8092
    depends_on:
      mariadb-prod:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    networks:
      - againspring-prod

  ai-user-orchestrator-prod:
    build:
      context: ../ai-user/orchestrator
      dockerfile: Dockerfile
    image: againspring-ai-user-orchestrator-prod
    container_name: againspring-ai-user-orchestrator-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER:-againspring}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      BACKEND_BASE_URL: http://againspring-backend-prod:8080
      LLM_AI_USER_URL: http://againspring-llm-ai-user-prod:8092
      AI_USER_ENABLED: ${AI_USER_ENABLED:-false}
      AI_USER_TICK_CRON: "0 * * * * *"
      AI_USER_DAILY_GLOBAL_CAP: ${AI_USER_DAILY_GLOBAL_CAP:-500}
      AI_USER_BOT_PASSWORD: ${AI_USER_BOT_PASSWORD:-ai-user-dev-pw-2026}
      AI_USER_SEED_ENABLED: ${AI_USER_SEED_ENABLED:-true}
      AI_USER_HISTORY_DIR: /app/personas/profiles
      AI_USER_REPETITION_THRESHOLD: ${AI_USER_REPETITION_THRESHOLD:-0.45}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-true}
      AI_LEARNING_BASE_URL: http://againspring-ai-learning-prod:8099
      SELF_CRITIQUE_ENABLED: ${SELF_CRITIQUE_ENABLED:-true}
      AI_USER_PERSONA_TARGET: ${AI_USER_PERSONA_TARGET:-50}
      AI_USER_PERSONAS_DIR: /app/personas
      AI_USER_FORCE_ACTIVE: ${AI_USER_FORCE_ACTIVE:-false}
      AI_USER_SECONDARY_BACKEND_URL: http://againspring-backend-dev:8080
      PAIRED_POST_ENABLED: ${PAIRED_POST_ENABLED:-true}
      PAIRED_POST_CRON: "${PAIRED_POST_CRON:-0 0 */2 * * *}"
      PAIRED_POST_PAIRS: ${PAIRED_POST_PAIRS:-3}
    volumes:
      - ../ai-user/docs/personas:/app/personas:rw
    depends_on:
      mariadb-prod:
        condition: service_healthy
      llm-ai-user-prod:
        condition: service_healthy
      backend-prod:
        condition: service_started
      ai-learning-prod:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - againspring-prod
      - againspring-dev    # dev 백엔드에 동시 게시하기 위해 dev 네트워크도 연결

  ai-content-sync:
    build:
      context: ../ai-user/sync
      dockerfile: Dockerfile
    image: againspring-ai-content-sync
    container_name: againspring-ai-content-sync
    environment:
      # prod DB (소스)
      PROD_DB_HOST: againspring-mariadb-prod
      PROD_DB_PORT: 3306
      PROD_DB_USER: ${MARIADB_USER:-againspring}
      PROD_DB_PASSWORD: ${MARIADB_PASSWORD}
      PROD_DB_NAME: ${MARIADB_DATABASE:-againspring_prod}
      # dev DB (대상) — 별도 패스워드 (DEV_MARIADB_PASSWORD)
      DEV_DB_HOST: againspring-mariadb-dev
      DEV_DB_PORT: 3306
      DEV_DB_USER: ${MARIADB_USER:-againspring}
      DEV_DB_PASSWORD: ${DEV_MARIADB_PASSWORD}
      DEV_DB_NAME: againspring_dev
      # 동기화 주기 (초) + 소급 기간 (일)
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_BACKFILL_DAYS: ${SYNC_BACKFILL_DAYS:-3}
    depends_on:
      mariadb-prod:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - againspring-prod   # prod DB 접근
      - againspring-dev    # dev DB 접근

  nginx-prod:
    image: nginx:alpine
    container_name: againspring-nginx-prod
    ports:
      - "8091:80"    # Cloudflare Tunnel → localhost:8091 → againspring.net
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-prod
      - backend-prod
    restart: always
    networks:
      - againspring-prod

  llm-prod:
    build:
      context: ../llm-worker
      dockerfile: Dockerfile
    image: againspring-llm-prod
    container_name: againspring-llm-prod
    environment:
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-claude-sonnet-4-6}
      LLM_POOL_SIZE: ${LLM_POOL_SIZE:-100}
      LLM_QUEUE_CAPACITY: ${LLM_QUEUE_CAPACITY:-500}
      LLM_QUEUE_WAIT_TIMEOUT_MS: ${LLM_QUEUE_WAIT_TIMEOUT_MS:-30000}
      LLM_DEFAULT_TIMEOUT_MS: ${LLM_DEFAULT_TIMEOUT_MS:-120000}
    volumes:
      - ${CLAUDE_HOST_CONFIG_DIR:-/home/justant/.claude}:/root/.claude
    restart: unless-stopped
    networks:
      - againspring-prod
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s


networks:
  againspring-prod:
    driver: bridge
  againspring:
    external: true
    name: againspring
  againspring-dev:
    external: true
    name: againspring-dev_againspring-dev    # dev 스택이 먼저 기동돼 있어야 함

volumes:
  mariadb_prod_data:
