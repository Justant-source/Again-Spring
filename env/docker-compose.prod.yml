# 서버 prod 스택 — againspring.net / www.againspring.net
# 사용: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 환경변수: .env.prod 파일 필요 (.env.prod.example 참조)
# ⚠️ 주의: 명시적 배포 요청 없이 절대 실행 금지
# 사전 조건: docker compose up -d (base 스택, againspring-llm 공유 서비스)
# 선택 사항: docker compose -f docker-compose.ai-user.yml --env-file .env.ai-user up -d --build (공통 ai-user 스택)

name: againspring-prod

services:
  mariadb-prod:
    image: mariadb:lts
    container_name: againspring-mariadb-prod
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-againspring}
      MARIADB_USER: ${MARIADB_USER:-againspring}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --default-time-zone=+00:00
      - --max-connections=200
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - againspring-prod

  backend-prod:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: againspring-backend-prod
    container_name: againspring-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://againspring-mariadb-prod:3306/${MARIADB_DATABASE:-againspring}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AS_SECRET_MASTER_KEY: ${AS_SECRET_MASTER_KEY}
      # App secrets (JWT/OAuth/mail/ASM tokens) → encrypted_secret vault only (do not inject empty env)
      LLM_PROVIDER: ${LLM_PROVIDER:-remote}
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-remote}
      LLM_REPORT_PROVIDER: ${LLM_REPORT_PROVIDER:-remote}
      LLM_WORKER_URL: ${LLM_WORKER_URL:-http://againspring-llm:8090}
      # Keep the HTTP client beyond the worker's 10-minute execution deadline.
      LLM_REMOTE_DEFAULT_TIMEOUT_MS: ${LLM_REMOTE_DEFAULT_TIMEOUT_MS:-600000}
      LLM_REMOTE_READ_TIMEOUT_MS: ${LLM_REMOTE_READ_TIMEOUT_MS:-610000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-againspring2026@gmail.com}
      ASM_BASE_URL: ${ASM_BASE_URL:-}
      ASM_ENABLED: ${ASM_ENABLED:-false}
      # 미배선 시 application.yml 기본값 :8090 → prod 잡이 dev 콜백/재구동으로 감 (job #974).
      ASM_CALLBACK_BASE_URL: ${ASM_CALLBACK_BASE_URL:-http://100.81.189.92:8091}
      # 숏폼 렌더 프로필. marketing_v2 = 새 레이아웃 + 효과음.
      # 이 줄이 없으면 .env 값이 컨테이너에 전달되지 않아 코드 기본값
      # (marketing_fast)이 쓰인다 — 효과음이 통째로 빠지는 원인이었다.
      MARKETING_RENDER_PROFILE: ${MARKETING_RENDER_PROFILE:-marketing_fast}
      # 24h 홀딩 풀 적재 스케줄러. 이게 꺼져 있으면 어드민이 「대기」 탭을
      # 열어야만 새 사연이 풀에 들어가고, 열지 않은 날은 영상 잡이 0건이 된다.
      # 무인 스케줄러라 코드 기본값은 false — 켜는 곳에서 명시한다.
      MARKETING_HOLDING_POOL_REFRESH_ENABLED: ${MARKETING_HOLDING_POOL_REFRESH_ENABLED:-false}
      ASM_X_THREAD_PUBLISH_TRIGGER_ENABLED: ${ASM_X_THREAD_PUBLISH_TRIGGER_ENABLED:-false}
      # ISO-8601 Instant. Required when trigger is on — only posts created at/after this get 24h auto-publish.
      ASM_AUTO_PUBLISH_SINCE: ${ASM_AUTO_PUBLISH_SINCE:-}
      AI_LEARNING_URL: ${AI_LEARNING_URL:-http://againspring-ai-learning:8099}
      AI_USER_LLM_URL: ${AI_USER_LLM_URL:-http://againspring-llm-ai-user:8092}
      AI_USER_ORCHESTRATOR_URL: ${AI_USER_ORCHESTRATOR_URL:-http://againspring-ai-user-orchestrator:8096}
      # 미공개 e2e-realbe(:8091)용 — 기본 5/min이면 prelogin 5계정+스모크가 429. 정식 공개 전 재검토.
      SECURITY_RATE_LIMIT_AUTH_PER_MINUTE: ${SECURITY_RATE_LIMIT_AUTH_PER_MINUTE:-60}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://againspring.net/api/internal/telegram/webhook}
    volumes:
      - ../docs/shared/prompts:/app/shared/docs/prompts:ro
      - ../docs/shared/categories.yml:/app/shared/docs/categories.yml:ro
      - ../docs/shared/policies/user-permissions.json:/app/shared/docs/policies/user-permissions.json:ro
      - ../docs/shared/templates:/app/shared/docs/templates:ro
    depends_on:
      mariadb-prod:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/api/health 2>/dev/null | grep -q 'OK\\|UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - againspring-prod
      - againspring

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://againspring.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${NAVER_SITE_VERIFICATION:-}
    image: againspring-frontend-prod
    container_name: againspring-frontend-prod
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://againspring-backend-prod:8080
    depends_on:
      - backend-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - againspring-prod

  nginx-prod:
    image: nginx:alpine
    container_name: againspring-nginx-prod
    ports:
      - "8091:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 접근/에러 로그 영속화 (18일치만 남던 docker stdout 순환 소실 방지).
      # 호스트 디렉토리는 미리 justant 소유로 생성해둘 것 — Docker가 자동 생성하면
      # root 소유가 되어 과거 마운트 지점 권한 사고가 재발한다. 로테이션은
      # env/nginx/logrotate.conf(호스트 cron) 참조. docs/env/deployment.md 참고.
      - ./logs/nginx/prod:/var/log/nginx
    depends_on:
      - frontend-prod
      - backend-prod
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - againspring-prod

networks:
  againspring-prod:
    driver: bridge
    name: againspring-prod
  againspring:
    external: true
    name: againspring

volumes:
  mariadb_prod_data:
