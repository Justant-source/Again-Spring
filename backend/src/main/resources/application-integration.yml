# Phase 4: Testcontainers MariaDB + Flyway 실제 실행 프로파일
# DataSource URL/user/pass는 MariaDbIntegrationSupport.DynamicPropertySource가 런타임에 주입.
spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.againspring: INFO
    org.springframework: WARN
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: false

llm:
  provider: mock
  claude-code:
    binary-path: /usr/local/bin/claude
