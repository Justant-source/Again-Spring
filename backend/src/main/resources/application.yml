spring:
  application:
    name: againspring
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:againspring2026@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-at-least-256-bits-long-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  expiration-ms: 86400000

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

app:
  url: ${APP_URL:https://dev.againspring.net}
  admin-emails: ${ADMIN_EMAILS:againspring2026@gmail.com}
  prompts:
    path: ${PROMPTS_PATH:./shared/docs/prompts}
  templates:
    path: ${TEMPLATES_PATH:./shared/docs/templates/first_message}
  features:
    duo-mode: ${DUO_MODE_ENABLED:false}
  categories:
    path: ${CATEGORIES_PATH:./shared/docs/categories.yml}
  user-permissions:
    path: ${USER_PERMISSIONS_PATH:./shared/docs/policies/user-permissions.json}
  safety:
    enabled: true
    forbidden-words-path: ${SAFETY_FORBIDDEN_WORDS_PATH:classpath:/safety/forbidden-words.yml}
  crisis:
    webhook-url: ${CRISIS_WEBHOOK_URL:}
    email: ${CRISIS_EMAIL:}
  mail:
    from-name: "다시봄 운영팀"
    support-email: againspring2026@gmail.com

llm:
  provider: ${LLM_PROVIDER:claude-code}
  remote:
    base-url: ${LLM_WORKER_URL:http://againspring-llm-dev:8090}
    connect-timeout-ms: ${LLM_REMOTE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${LLM_REMOTE_READ_TIMEOUT_MS:130000}
    default-timeout-ms: ${LLM_REMOTE_DEFAULT_TIMEOUT_MS:120000}
    poll-wait-ms: ${LLM_REMOTE_POLL_WAIT_MS:25000}
  claude-code:
    binary-path: ${CLAUDE_BIN:claude}
    model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
    report-model: ${REPORT_LLM_MODEL:claude-sonnet-4-6}
    pool-size: ${CLAUDE_POOL_SIZE:3}
    default-timeout-ms: 120000
  claude-api:
    key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-4-5}

logging:
  level:
    root: INFO
    org.springframework: INFO
