spring:
  application:
    name: againspring
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  data:
    web:
      pageable:
        # PageImpl 직렬화 경고 억제 (Spring Data 3.3+)
        serialization-mode: via-dto
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:againspring2026@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      # 관리자 마케팅 썸네일 업로드용 — 앱 레벨 검증은 2MB(YouTube thumbnails.set 상한)이므로
      # 여기는 그 요청 오버헤드를 감안한 여유치.
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-at-least-256-bits-long-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  expiration-ms: 86400000

againspring:
  search:
    # 기동 시 post_search_ngrams 미적재분 백필 (최대 2만건/기동)
    ngram-backfill-on-startup: ${SEARCH_NGRAM_BACKFILL_ON_STARTUP:true}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

app:
  url: ${APP_URL:https://dev.againspring.net}
  admin-emails: ${ADMIN_EMAILS:againspring2026@gmail.com}
  prompts:
    path: ${PROMPTS_PATH:./shared/docs/prompts}
  templates:
    path: ${TEMPLATES_PATH:./shared/docs/templates/first_message}
  features:
    duo-mode: ${DUO_MODE_ENABLED:false}
    marketing:
      enabled: ${MARKETING_ENABLED:false}        # dev 전용 — prod에서 절대 true 설정 금지
      renderer-url: ${MARKETING_RENDERER_URL:http://localhost:9000}
      public-base-url: ${MARKETING_PUBLIC_BASE_URL:https://againspring.net}  # 홍보 사연 링크 도메인
  categories:
    path: ${CATEGORIES_PATH:./shared/docs/categories.yml}
  user-permissions:
    path: ${USER_PERMISSIONS_PATH:./shared/docs/policies/user-permissions.json}
  safety:
    enabled: true
    forbidden-words-path: ${SAFETY_FORBIDDEN_WORDS_PATH:classpath:/safety/forbidden-words.yml}
  crisis:
    webhook-url: ${CRISIS_WEBHOOK_URL:}
    email: ${CRISIS_EMAIL:}
  mail:
    from-name: "다시봄 운영팀"
    support-email: againspring2026@gmail.com

llm:
  enabled: ${LLM_ENABLED:true}
  compose:
    model: ${COMPOSE_LLM_MODEL:claude-haiku-4-5-20251001}
  correction:
    model: ${CORRECTION_LLM_MODEL:claude-sonnet-4-6}             # 단건 분석 (analyzeById) — Sonnet
    map-model: ${CORRECTION_MAP_LLM_MODEL:claude-haiku-4-5-20251001}  # 일괄 MAP 단계 (청크별 패턴 추출) — Haiku
    reduce-model: ${CORRECTION_REDUCE_LLM_MODEL:claude-opus-4-8}      # REDUCE 단계 (통합·scope 판정) — Opus
  remote:
    base-url: ${LLM_WORKER_URL:http://againspring-llm:8090}
    connect-timeout-ms: ${LLM_REMOTE_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${LLM_REMOTE_READ_TIMEOUT_MS:610000}
    default-timeout-ms: ${LLM_REMOTE_DEFAULT_TIMEOUT_MS:600000}
    poll-wait-ms: ${LLM_REMOTE_POLL_WAIT_MS:25000}

ai-learning:
  enabled: ${AI_LEARNING_ENABLED:false}
  base-url: ${AI_LEARNING_URL:http://againspring-ai-learning:8099}

ai:
  prompt:
    llm-url: ${AI_USER_LLM_URL:http://againspring-llm-ai-user:8092}
  user:
    orchestrator-url: ${AI_USER_ORCHESTRATOR_URL:http://againspring-ai-user-orchestrator:8096}

asm:
  base-url: ${ASM_BASE_URL:http://100.115.252.61:8200}
  api-token: ${ASM_API_TOKEN:asm-dev-token-change-in-prod}
  poll-interval-ms: ${ASM_POLL_INTERVAL_MS:15000}
  # Remote renderer/TTS delay is reconciled as SLA_BREACHED/WAITING_EXTERNAL, never FAILED by itself.
  processing-sla-ms: ${ASM_PROCESSING_SLA_MS:900000}
  request-timeout-ms: ${ASM_REQUEST_TIMEOUT_MS:30000}
  # 통계 수집(X Playwright·YT API)은 10s로는 부족 — 기본 5분
  stats-request-timeout-ms: ${ASM_STATS_REQUEST_TIMEOUT_MS:300000}
  enabled: ${ASM_ENABLED:true}
  callback-token: ${ASM_CALLBACK_TOKEN:asm-callback-token-dev}
  callback-base-url: ${ASM_CALLBACK_BASE_URL:http://100.81.189.92:8090}
  x-thread-poll-interval-ms: ${ASM_X_THREAD_POLL_INTERVAL_MS:600000}
  # 기본 false — ASM은 dev/prod 공유 단일 인스턴스(같은 실 X/IG 계정)라, 사람 개입 없는
  # 이 스케줄러가 켜지면 dev 재배포만으로도 실제 계정에 자동 발행된다(2026-07-31 실제 발생·수동 정리).
  # prod에서 기능을 켤 때만 .env.prod에 ASM_X_THREAD_PUBLISH_TRIGGER_ENABLED=true.
  # true면 x_thread + instagram_feed 둘 다 post.createdAt+24h one-shot 자동 발행.
  x-thread-publish-trigger-enabled: ${ASM_X_THREAD_PUBLISH_TRIGGER_ENABLED:false}
  # 자동 발행 하한 (ISO-8601 Instant). 트리거 ON이어도 이 시각 이후 생성된 글만 24h 후 발행.
  # 비어 있으면 fail-closed(스킵) — 과거 백로그 폭주 방지 (2026-08-02).
  auto-publish-since: ${ASM_AUTO_PUBLISH_SINCE:}

marketing:
  telegram:
    # 실패 알림에 인라인 버튼(재구동/무시) 표시 여부. 기본값 false (안전 장치).
    # 활성화 시 Telegram 인라인 버튼 클릭 → ASM webhook → AS redrive API 호출 흐름 개시.
    buttons-enabled: ${MARKETING_TELEGRAM_BUTTONS_ENABLED:false}

logging:
  level:
    root: INFO
    org.springframework: INFO
