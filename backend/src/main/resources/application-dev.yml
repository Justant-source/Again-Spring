spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

logging:
  level:
    com.againspring: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    enabled: true

llm:
  chat:
    provider: remote    # dev는 CLI 워커(remote) 사용 — API 스모크 시 LLM_CHAT_PROVIDER=claude-api 임시 설정
  report:
    provider: remote
  remote:
    read-timeout-ms: 250000
    default-timeout-ms: 240000

app:
  admin:
    enabled: true
  seed:
    enabled: true
  session:
    min-messages-to-finalize: 5  # V13 Phase 4 (prod 기본값: 5)
  features:
    marketing:
      enabled: true              # dev 전용 기능 — prod application-prod.yml에는 포함하지 않음
      renderer-url: ${MARKETING_RENDERER_URL:http://againspring-marketing-renderer-dev:9000}
      social-poster-url: ${SOCIAL_POSTER_URL:http://againspring-social-poster-dev:9100}
      image-dir: /var/marketing-assets
  social:
    master-key: ${SOCIAL_MASTER_KEY:}
    publishing-enabled: ${SOCIAL_PUBLISHING_ENABLED:true}
    webhook-url: ${SOCIAL_WEBHOOK_URL:}
    email: ${SOCIAL_EMAIL:}
