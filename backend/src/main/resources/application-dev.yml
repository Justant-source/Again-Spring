spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

logging:
  level:
    com.againspring: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    enabled: true

llm:
  remote:
    read-timeout-ms: 250000
    default-timeout-ms: 240000

app:
  admin:
    enabled: true
  seed:
    enabled: true
  session:
    min-messages-to-finalize: 5  # V13 Phase 4 (prod 기본값: 5)
  features:
    duo-mode: ${DUO_MODE_ENABLED:false}
