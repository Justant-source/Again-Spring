spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

logging:
  level:
    com.againspring: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    enabled: true
