level4:
  # Relationship termination encouragement - UI complete ban
  - pattern: "헤어지세요"
    category: RELATIONSHIP_TERMINATION
    crisis: false
  - pattern: "이혼추천"
    category: RELATIONSHIP_TERMINATION
