level1:
  # Legal risk words - UI complete ban
  - pattern: "과실비율"
    category: LEGAL_RISK
    crisis: false
  - pattern: "판결"
    category: LEGAL_RISK
    crisis: false
  - pattern: "판사"
    category: LEGAL_RISK
    crisis: false
  - pattern: "유죄"
    category: LEGAL_RISK
    crisis: false
  - pattern: "무죄"
    category: LEGAL_RISK
    crisis: false
  - pattern: "가해자"
    category: STIGMA
    crisis: false
  - pattern: "피해자"
    category: STIGMA
    crisis: false
  - pattern: "고소"
    category: LEGAL_RISK
    crisis: false
