spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  tomcat:
    threads:
      max: 600
      min-spare: 20
    accept-count: 100

logging:
  level:
    com.againspring: WARN
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    enabled: false

llm:
  chat:
    provider: ${LLM_CHAT_PROVIDER:claude-api}    # prod 기본: claude-api (Haiku + 캐싱)
  report:
    provider: ${LLM_REPORT_PROVIDER:remote}      # prod 기본: CLI Sonnet 유지

management:
  endpoints:
    web:
      exposure:
        include: health
