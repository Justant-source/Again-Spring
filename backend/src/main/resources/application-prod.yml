spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  tomcat:
    threads:
      max: 600
      min-spare: 20
    accept-count: 100

logging:
  level:
    com.againspring: WARN
    # 메일 발송 성공/실패는 prod에서도 보이도록 (진단성)
    com.againspring.service.EmailVerificationService: INFO
    com.againspring.service.PasswordResetService: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  features:
    marketing:
      enabled: ${MARKETING_ENABLED:false}
      renderer-url: ${MARKETING_RENDERER_URL:http://againspring-marketing-renderer-prod:9000}
      social-poster-url: ${SOCIAL_POSTER_URL:http://againspring-social-poster-prod:9100}
      image-dir: /var/marketing-assets
  social:
    master-key: ${SOCIAL_MASTER_KEY:}
    publishing-enabled: ${SOCIAL_PUBLISHING_ENABLED:true}
    webhook-url: ${SOCIAL_WEBHOOK_URL:}
    email: ${SOCIAL_EMAIL:}
