spring:
  application:
    name: llm-ai-user
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

llm:
  worker:
    pool-size: ${LLM_POOL_SIZE:20}
    queue-capacity: ${LLM_QUEUE_CAPACITY:100}
    queue-wait-timeout-ms: ${LLM_QUEUE_WAIT_TIMEOUT_MS:30000}
    default-timeout-ms: ${LLM_DEFAULT_TIMEOUT_MS:120000}
    claude-binary-path: ${CLAUDE_BIN:claude}
    claude-model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
  api:
    prompt-caching: ${LLM_API_PROMPT_CACHING:true}

logging:
  level:
    root: INFO
    com.againspring.aiuser.llm: DEBUG

self-critique:
  enabled: ${SELF_CRITIQUE_ENABLED:false}
  pass-threshold: ${SELF_CRITIQUE_THRESHOLD:5}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:-}
