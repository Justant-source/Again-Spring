spring:
  application:
    name: llm-ai-user
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

llm:
  worker:
    pool-size: ${LLM_POOL_SIZE:20}
    queue-capacity: ${LLM_QUEUE_CAPACITY:100}
    queue-wait-timeout-ms: ${LLM_QUEUE_WAIT_TIMEOUT_MS:30000}
    default-timeout-ms: ${LLM_DEFAULT_TIMEOUT_MS:600000}
    claude-binary-path: ${CLAUDE_BIN:claude}
    claude-model: ${AI_INTERACTION_CLAUDE_MODEL:${CLAUDE_MODEL:claude-haiku-4-5-20251001}}
    codex-binary-path: ${CODEX_BIN:codex}
    codex-terra-model: ${AI_POST_CODEX_MODEL:gpt-5.6-terra}
    codex-luna-model: ${AI_INTERACTION_CODEX_MODEL:gpt-5.6-luna}
  # 글(POST) 전용 모델 오버라이드 — 빈 값이면 claude-model 사용
  post-model: ${AI_POST_CLAUDE_MODEL:${LLM_POST_MODEL:claude-sonnet-5}}
  api:
    prompt-caching: ${LLM_API_PROMPT_CACHING:false}
    cache-ttl: ${LLM_API_CACHE_TTL:5m}
    refusal-retries: ${LLM_API_REFUSAL_RETRIES:0}
    refusal-fallback-model: ${LLM_API_REFUSAL_FALLBACK_MODEL:}
  parse-failure-sampling:
    enabled: ${LLM_PARSE_FAILURE_SAMPLING_ENABLED:true}
    dir: ${LLM_PARSE_FAILURE_SAMPLING_DIR:/tmp/llm-parse-failures}

logging:
  level:
    root: INFO
    com.againspring.aiuser.llm: DEBUG

self-critique:
  enabled: ${SELF_CRITIQUE_ENABLED:false}
  pass-threshold: ${SELF_CRITIQUE_THRESHOLD:5}
  # 추가 AI 상투구 (쉼표 구분 리터럴) — 운영 중 발견 시 재배포 없이 등록
  extra-cliches: ${SELF_CRITIQUE_EXTRA_CLICHES:}
  rare-vocab:
    # 어휘이질(T5) detector — 캘리브레이션 후 enabled: true 설정
    enabled: ${SELF_CRITIQUE_RARE_VOCAB_ENABLED:false}
    ratio-threshold: ${SELF_CRITIQUE_RARE_VOCAB_RATIO:0.18}
    min-tokens: ${SELF_CRITIQUE_RARE_VOCAB_MIN_TOKENS:25}
    penalty: ${SELF_CRITIQUE_RARE_VOCAB_PENALTY:1}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:-}
