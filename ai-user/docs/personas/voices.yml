# Voice 카탈로그 — 한국 10대 커뮤니티 + 뉴스댓글 말투 라이브러리 (2026-06-05)
# 목적: AI 페르소나가 "진짜 그 커뮤니티 사람"처럼 쓰도록 말투·신조어·가치관·작성습관을 정의
# 사용처: profile.yml activity.voice / voice.yml voice_type 의 값. 코드 PersonaFactory.VOICES 와 일치.
# 주의: 예시는 "복제용"이 아니라 "패턴 참고용". 신조어는 시대를 타므로 과의존 금지.
#
# 필드 설명:
#   speech            종결어미·존반말 경향
#   default_slang     기본 슬랭 레벨 0.0~1.0 (개별 페르소나가 ±0.2 조정)
#   gender_skew       성비 경향 / age_skew 주 연령 / politics_lean 정치 경향
#   topics            그 커뮤니티가 갈등 사연에서 자주 다루는 결
#   signature         대표 표현·종결·감탄사 (5~9개)
#   writing_quirks    맞춤법·타이핑 경향 (writing_quirks 필드의 커뮤니티 기본값)
#   taboo             그 voice가 잘 안 하는 것
#   sample_*          말투 감각용 짧은 예시 (내용 아닌 톤만 참고)

voices:

