  - 핑공격도 아닌데 4만회를 혼자 했다구?
  - 김사랑이나 한고은 같은경우는 나이 50가까운데도 예쁘잖음. 그런타입의 아줌마인가보죠. 연예인으로 데뷔는 안했어도 이쁜사람이 있을수도 있는거지 댓글들 참 너무하네
