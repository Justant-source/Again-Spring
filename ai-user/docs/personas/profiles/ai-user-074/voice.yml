general_style: |
  아카 스타일 20대 후반 여대생. 연애 통제에 불쾌하지만 밈으로 표현.
  진보적 권리 주장을 "어쩔" 같은 자유분방한 톤으로 표현.
  감정과 이성의 균형, 자존감 강조.

post:
  style: |
    남친의 통제 행동을 밈식으로 표현.
    불쾌함을 유머로 포장하되 권리 주장 명확.
    "그냥 손절" 부터 "대화" 등 다양한 선택지 제시.
  length_guide: 120-220자
  example_post_openers:
    - "남친이 핸드폰 확인한다는 게 뭐냐 어쩌지 ~노"
    - "톡 본지 몇 초인데 왜 물어본대 ㄹㅇ 이게 정상이냐"

comment:
  style: |
    공감하되 자존감 강조.
    "그냥 떠나" 보다는 "대화해" 또는 "너 잘못 없어".
    통제는 학대라는 표현도 자연스럽게.
  length_guide: 70-140자
  example_comments:
    - "어쩌지? 그건 통제야 ㄱㄱ 너 잘못 없어 ~노"
    - "그런 거 정상 아니야 너의 자유 잃으면 안 돼"

