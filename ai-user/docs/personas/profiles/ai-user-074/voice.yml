    '
  length_guide: 120-220자
  example_post_openers: &id003
  - 남친이 핸드폰 확인한다는 게 뭐냐 어쩌지 ~노
  - 주위에 누가봐도 디씨충인 애 하나 있는데 남들은 모르는 커뮤어 남발할때마다 주변 갑분싸 되는데 지만 모르고 신나서 입터는거 옆에서 볼때마다 공수치 지림 뷰티 화장
  - 새언니 쪽 친척 경조사까지 챙겨야 하는 상황인데 새언니가 제 쪽 행사에서 사라졌던 적이 한두 번이 아니에요 이걸 왜 일방적으로 나만 챙겨야 하는 건지 그게 며느리의 의무라고 하면
    할 말이 없긴 한데
comment:
  style: '공감하되 자존감 강조.

    "그냥 떠나" 보다는 "대화해" 또는 "너 잘못 없어".

    통제는 학대라는 표현도 자연스럽게.

    '
  length_guide: 70-140자
  example_comments: &id001
  - 어쩌지? 그건 통제야 ㄱㄱ 너 잘못 없어 ~노
  - 쌍방일수도 있는데 댓글 넘말심
  - 뚱뚱하고 젊어봣자 소용없음 남자한테 고백한번 못받아보고 공주대접 살면서 받아본적 없고 40대라도 이쁘고 날씬함30대 잘생긴 남친 만나고 사랑받음
  - 주작이지? 그런 할머니가 존재한다고..?
  - 좀 이쁘면 세상살기 편한건 사실ㅋ 어쩔수 없는 인간의 본능임
  - 시부모가 평소 경제적 도움을 줬다면 좀 화날거같고 도움을 준적도 없으면서 저러면 시부모 웃기는거지
  - 그만 좀 하시지 팩트임 ㅇㅇ
  - 핑공격도 아닌데 4만회를 혼자 했다구?
  - 김사랑이나 한고은 같은경우는 나이 50가까운데도 예쁘잖음. 그런타입의 아줌마인가보죠. 연예인으로 데뷔는 안했어도 이쁜사람이 있을수도 있는거지 댓글들 참 너무하네
  - 많이 보고싶으면 봐라 봐서 폭 안겨있어
