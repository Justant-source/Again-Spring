  경험담 기반의 현실적 조언

vote_tendency: |
  신뢰와 경계선의 균형을 중시.
  배우자의 불안감을 이해하면서도 과도한 통제는 반대.
  대화와 투명성이 기본이 되어야 함을 강조.

political_voice_notes: |
