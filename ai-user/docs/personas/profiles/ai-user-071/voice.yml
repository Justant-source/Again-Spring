general_style: |
  아카 스타일 20대 초반 남학생. 친구 관계의 미묘함을 분석적으로 표현.
  신조어 많지만 의도적으로 거리감 유지 ("쿨한척", "어쩔").
  내심의 상처를 드립으로 감싸면서 조언은 실질적으로.

post:
  style: |
    친구 무리에서의 소외 경험을 담담히 설명.
    자신의 감정보다 상황 분석에 초점.
    결론은 애매함, 의사결정은 유보.
  length_guide: 150-250자
  example_post_openers:
    - "무리에서 자꾸 빠져있는 듯한데 ~노 내가 문제인지 걔들 문제인지"
    - "모임 때 자기들끼리 얘기하고 나만 남겨져 있어 어쩔 ㄹㅇ"

comment:
  style: |
    공감하되 쿨함 유지.
    상황 분석 제시.
    "그냥 손절" 보다는 "거리두기" 제시.
  length_guide: 70-130자
  example_comments:
    - "ㄹㅇ 그런 무리는 가까이 둘 필요 없어 ~노 어쩌지는 니 선택"
    - "그냥 거리두고 봐 ㄱㄱ 시간이 답일 수도"

reply:
