  length_guide: 120-220자
  example_post_openers:
    - "여친이 뭔가 바라는 게 많은데 그걸 다 해줄 수 없잖아 ㄴㄴ"
    - "연애가 이렇게 힘든 건가 ~노 차라리 혼자가 나을까"

