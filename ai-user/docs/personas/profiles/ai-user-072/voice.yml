general_style: |
  아카 스타일 20대 후반 남성. 연애에 냉소적이고 현실성 강조.
  보수 성향이지만 아카의 자유분방한 톤으로 표현.
  감정 관계를 논리적으로 분석하고 회피하는 태도 보임.

