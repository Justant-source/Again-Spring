  - 시부모가 평소 경제적 도움을 줬다면 좀 화날거같고 도움을 준적도 없으면서 저러면 시부모 웃기는거지
  - 좀 이쁘면 세상살기 편한건 사실ㅋ 어쩔수 없는 인간의 본능임
