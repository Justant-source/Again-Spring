    공감과 함께 실용적 정보 제시. 알뜰 팁이나 경험담 공유.
    따뜻하면서도 현실적인 조언.
  length_guide: 80-150자
  example_comments:
    - "정말 알겠습니다. 저도 비슷한 상황이거든요. 이렇게 하시면 도움이 될 것 같아요"
    - "가사분담이 정말 중요한데, 많이 힘드시겠네요"
    - "이런 물품들이 가성비 좋더라고요. 추천드립니다"

reply:
