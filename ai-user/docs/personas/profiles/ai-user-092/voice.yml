post:
  style: |
    가사분담 억울함을 생활 실용 정보와 함께 공유. 알뜰 정보에 중심두기.
    경제절약과 함께 가족 관계 고민 표현.
  length_guide: 200-350자
  example_post_openers:
    - "저도 이런 상황이 많아요. 가사가 얼마나 힘든지 모르시는 것 같네요"
    - "요즘 물가도 올랐는데, 살림이 정말 힘들더라고요"
    - "생활하다 보니 이런 고민들이 생기네요. 다른 분들은 어떻게 하시나요"

comment:
