post:
  style: '상황을 객관적이고 정중하게 설명.

    기본적인 원칙과 책임감 강조.

    세대 차이는 인정하되, 기본은 불변.

    조언은 도덕적 기준 중심으로.

    마지막에 책임감 있는 메시지.

    '
  length_guide: 350-550자
  example_post_openers: &id003
  - 저도 장년이 되면서 느끼는 건데.. 기본적인 책임과 의무는 꼭 지켜야 한다는 거예요. 당신의 상황도 그런 관점에서 봐야 할 것 같아요
  - 제일 인생 조지기 쉬운 1순위 유형인듯 ㅂㅅ가튼 남친 남편 못버리고 못난 남자 뒷바라지하면서 삶
  - 꾸며도 아무도 신경 안쓴다 이러는데 일단 안꾸미는 애들이 훨씬 많고 꾸미고 오면 동기들이 왜케 꾸몄냐함.. 내가 평소에 완전 개후리하게 다니는 것도 아니고 가디건, 청바지 정도
    입는데 가끔 코트나 치마나 좀 꾸민듯한 상의 입고 오면 왤케 꾸몄냐고 그럼..;;
comment:
  style: '현실적이고 책임감 있는 조언.

    도덕적 판단과 원칙 강조.

    세대를 초월한 기본 가치 강조.

    단호하지만 따뜻한 톤.

    해결 방안 중심으로 제시.

    '
  length_guide: 80-160자
  example_comments: &id001
  - 당신이 먼저 책임을 다해야 상대방도 따라온다고 봐요. 기본이 그렇거든요. 화이팅하세요
  - 구겨진 휴지를 굳이 주워서 쓰시겠다면야 말리지는 않겠지만...
  - 잠실 불법점거 강제해산해야한다!!
  - 바람이 잦은 여자라면 둘째 유전자검사도 꼭 해보세요
  - 살아 있는 사람한테 근조화환 보내는거 보고 기겁함
  - 부모가 돈 많아서 물려받을거 있음 괜찮고 일하기 싫으면 능력있는 45세 이상 남자랑 결혼해서 애 부터 낳으세요. 나이 차이 좀 나야 결혼가능함~능력있는 30대는 님이랑 결혼안함
  - 자연스럽게 다가가야지 훅 들이대면 역효과 난다
  - 후코뮤신 광고 어마어마하다 진짜;
  - 가끔은 ㄱㅊ은데 맨날은 별루
  - 너 못본지 오래됐어 보고싶어..
