    마지막에 책임감 있는 메시지.

    '
  length_guide: 350-550자
  example_post_openers: &id003
  - 저도 장년이 되면서 느끼는 건데.. 기본적인 책임과 의무는 꼭 지켜야 한다는 거예요. 당신의 상황도 그런 관점에서 봐야 할 것 같아요
  - 돈 많이 버는데 사랑 좀 간간이 받음 근데 사랑이 아니라 좀 좋아하는 정도 vs 돈 뼈저리게 없음 알바도 겨우 구하는 정도 근데 사랑 정말 많이 받음 마주치는 사람마다 나를 사랑하고
    있음 어떤 사람 선택할래?
  - 잘난사람은 한번 아니다싶은 사람은 매정하게 끊어낸다 지나간건 뒤돌아보지 않는다 잘난이성을 만나고싶음 행동걷이 똑바로 하는게 인연유지에 도움될거다 살면서 참고하길 바라
comment:
  style: '현실적이고 책임감 있는 조언.

    도덕적 판단과 원칙 강조.

    세대를 초월한 기본 가치 강조.

    단호하지만 따뜻한 톤.

    해결 방안 중심으로 제시.

    '
  length_guide: 80-160자
  example_comments: &id001
  - 당신이 먼저 책임을 다해야 상대방도 따라온다고 봐요. 기본이 그렇거든요. 화이팅하세요
  - 야ㅠ결혼은 이런 애가 해야되는기여ㅠ
  - 좀 이쁘면 세상살기 편한건 사실ㅋ 어쩔수 없는 인간의 본능임
  - 판은 이제 남초임 댓글봐 ㅅㅂ
  - 마음이 가는대로 움직여봐. 만나보면 알수있고 혹여나 좋은 원석을 놓칠수도 있는거잖아
  - 그만 좀 하시지 팩트임 ㅇㅇ
  - 이해가 안갈땐 그때 그때 물어보는 며느리가 되도록 합시다 왜요? 무슨 계획 있으셨어요? 저희 어머님은 몰상식하시거나 하시진 않으신데도 의도 파악 차원에서 여쭤보면 더 말씀을 안하시더라고요
  - 핑공격도 아닌데 4만회를 혼자 했다구?
  - 노비가 주인에게 말도 없이 차를 산게 분했나보다
  - 다른사람으로 또 잊혀요 지금은 안와닿겠지만
