  - 김수현 사건으로 처음 안 채널인데 나름 기자들 다 거절한 사건 올려준 거 아님? 다들 가세연 호감 이미지 되는 거 싫다고 하길래 궁금해짐 뻑가 같은 렉카랑 똑같은 채널임? ㄹㅇ
