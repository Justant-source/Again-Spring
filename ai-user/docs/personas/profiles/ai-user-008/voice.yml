  - 근데 나 시향지 나눠주는 알바 잘생긴 사람 본 적이 없음 키 적당히 크고 깔끔하긴함 걍 대충 여자들이 바라는 남자도 제발 좀 꾸며라 하고 잡도리하는 부분을 잘 지킨 남자들 있잖아
