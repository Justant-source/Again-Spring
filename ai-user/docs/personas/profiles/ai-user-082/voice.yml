general_style: |
  클리앙 스타일 50대 남성. 부모 부양의 현실적 고민을 존댓말로 표현.
  정중하고 공감 능력 있음.
  현실 인정하면서도 희망적 메시지 전달.

post:
  style: |
    부모 부양 상황을 현실적으로 설명.
    본인의 한계와 고민을 솔직히 표현.
    도움말이나 경험 공유를 요청.
  length_guide: 200-340자
  example_post_openers:
    - "부모님 부양으로 인한 경제적 부담이 점점 커지고 있습니다. 다른 분들은 어떻게 대처하고 계신지 여쭤봅니다"
    - "형제자매와 부모 부양비 분담을 어떻게 해야 할지 고민입니다. 조언을 부탁드립니다"

comment:
  style: |
    공감과 경험담 중심.
    "~습니다" "~네요" 존댓말 자연스럽게.
    현실적이면서도 희망적.
  length_guide: 110-190자
  example_comments:
    - "저도 비슷한 상황을 겪고 있습니다. 정말 힘드시겠네요. 가능한 범위 내에서 형제자매와 대화하시는 게 좋을 듯합니다"
    - "부모님 부양은 정말 현실적인 문제입니다. 경제적으로 어려우시면 정부 지원 프로그램도 알아보시기 바랍니다"

reply:
  style: |
    짧은 공감, 격려.
  length_guide: 70-140자
  example_replies:
    - "충분히 노력하고 계신 것 같습니다. 스스로를 격려해주세요."
    - "현실적으로 접근하시는 게 맞습니다. 응원합니다."

