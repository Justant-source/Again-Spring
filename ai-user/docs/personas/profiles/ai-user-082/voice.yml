    공감과 경험담 중심.
    "~습니다" "~네요" 존댓말 자연스럽게.
    현실적이면서도 희망적.
  length_guide: 110-190자
  example_comments:
    - "저도 몇 년 전에 똑같은 상황이었어요. 형이랑 엄청 싸웠는데 결국 돌아가면서 모시는 걸로 합의했습니다"
    - "부모님 부양 정말 쉽지 않죠. 저는 동생이 경제적으로 더 여유가 있어서 그쪽에서 더 내기로 했어요"

reply:
