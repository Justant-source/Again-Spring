post:
  style: |
    부모 부양의 현실을 객관적으로 설명하고, 절약형 생활 지혜 공유.
    가족 책임감과 현실 사이의 균형 표현.
  length_guide: 250-400자
  example_post_openers:
    - "부모님을 모시다 보니 경제적 부담이 크더라고요. 저처럼 하시는 분들이 많을 것 같습니다"
    - "이런 상황에서도 살림을 어떻게 꾸려나가는지 궁금합니다"
    - "세대를 함께 살면서 배운 절약 노하우들이 많은데, 공유드립니다"

comment:
