spring:
  application:
    name: ai-user-orchestrator
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/againspring_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:againspring}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_aiuser   # CRITICAL: separate history from backend

server:
  port: 8096

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ai-user:
  enabled: ${AI_USER_ENABLED:false}
  matcher:
    author-threshold: ${AI_USER_MATCHER_AUTHOR_THRESHOLD:0.35}
  seed:
    enabled: ${AI_USER_SEED_ENABLED:true}
  tick-cron: ${AI_USER_TICK_CRON:"0 */10 * * * *"}
  daily-global-cap: ${AI_USER_DAILY_GLOBAL_CAP:200}
  bot-password: ${AI_USER_BOT_PASSWORD:ai-user-dev-pw-2026}
  backend-base-url: ${BACKEND_BASE_URL:http://againspring-backend-prod:8080}
  llm-ai-user-url: ${LLM_AI_USER_URL:http://againspring-llm-ai-user:8092}
  personas-dir: ${AI_USER_PERSONAS_DIR:/app/personas}
  # 반복 가드: 생성문 vs 최근 출력 2-gram Jaccard 임계 (초과 시 1회 재생성)
  repetition-threshold: ${AI_USER_REPETITION_THRESHOLD:0.45}
  # 최소 글 길이 — 이보다 짧으면 1회 재생성 (제목만 남거나 불완결 절단 방어)
  min-post-chars: ${AI_USER_MIN_POST_CHARS:50}
  secondary-backend-base-url: ${AI_USER_SECONDARY_BACKEND_URL:}
  paired-post:
    enabled: ${PAIRED_POST_ENABLED:false}
    cron: "${PAIRED_POST_CRON:0 0 5 * * *}"
    pairs-per-run: ${PAIRED_POST_PAIRS:2}
    target-share: ${PAIRED_POST_TARGET_SHARE:0.15}
    romantic-share: ${PAIRED_POST_ROMANTIC_SHARE:0.80}
  content-aware-decisions:
    enabled: ${AI_USER_CONTENT_AWARE_DECISIONS_ENABLED:true}
    analysis-budget-per-tick: ${AI_USER_ANALYSIS_BUDGET_PER_TICK:3}
  human-reply:
    delay-minutes-min: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MIN:1}
    delay-minutes-max: ${AI_USER_HUMAN_REPLY_DELAY_MINUTES_MAX:30}
    inbox-ttl-days: ${AI_USER_HUMAN_REPLY_INBOX_TTL_DAYS:7}
    plan-ttl-days: ${AI_USER_HUMAN_REPLY_PLAN_TTL_DAYS:7}
    # Destructive backlog expiry — default OFF; admin trigger can force a one-shot run.
    ttl-cleanup-enabled: ${AI_USER_HUMAN_REPLY_TTL_CLEANUP_ENABLED:false}
    # §16.7 / WP5 W6-B hard invariants (3×5=15, chunk 20, 0~3 responders)
    chunk-size: ${AI_USER_HUMAN_REPLY_CHUNK_SIZE:20}
    responders-per-interaction-min: ${AI_USER_HUMAN_REPLY_RESPONDERS_MIN:0}
    responders-per-interaction-max: ${AI_USER_HUMAN_REPLY_RESPONDERS_MAX:3}
    distinct-personas-per-post-human-max: ${AI_USER_HUMAN_REPLY_DISTINCT_PERSONAS_MAX:3}
    replies-per-persona-per-post-human-max: ${AI_USER_HUMAN_REPLY_PER_PERSONA_MAX:5}
    replies-per-post-human-max: ${AI_USER_HUMAN_REPLY_PER_POST_MAX:15}
    candidate-responders-max: ${AI_USER_HUMAN_REPLY_CANDIDATE_MAX:8}
  thread-plan:
    # Foundation maintenance is disabled until PLAN mode is explicitly rolled out.
    maintenance-enabled: ${AI_USER_THREAD_PLAN_MAINTENANCE_ENABLED:false}
    maintenance-cron: "${AI_USER_THREAD_PLAN_MAINTENANCE_CRON:0 */5 * * * *}"
    enabled: ${AI_USER_THREAD_PLAN_ENABLED:false}
    publisher-enabled: ${AI_USER_THREAD_PLAN_PUBLISHER_ENABLED:false}
    human-reply-batch-enabled: ${AI_USER_HUMAN_REPLY_BATCH_ENABLED:false}
    ai-post-provider: ${AI_USER_THREAD_PLAN_AI_POST_PROVIDER:CODEX}
    human-plan-provider: ${AI_USER_THREAD_PLAN_HUMAN_PROVIDER:CODEX}
    ai-post-model: ${AI_USER_THREAD_PLAN_AI_POST_MODEL:}
    human-plan-model: ${AI_USER_THREAD_PLAN_HUMAN_MODEL:}
    publish-batch-size: ${AI_USER_THREAD_PLAN_PUBLISH_BATCH_SIZE:20}
    human-reply-max-posts: ${AI_USER_HUMAN_REPLY_MAX_POSTS:10}
    human-reply-max-comments: ${AI_USER_HUMAN_REPLY_MAX_COMMENTS:50}
    # 글+최대 24개 후보를 한 번에 요청하는 구조화 생성은 단건 생성보다 오래 걸린다.
    bundle-timeout-ms: ${AI_USER_THREAD_PLAN_BUNDLE_TIMEOUT_MS:240000}
    # WP4: 4~6 persona micro-batch (default ON). false = legacy mega-call.
    micro-batch-enabled: ${AI_USER_THREAD_PLAN_MICRO_BATCH_ENABLED:true}
    micro-batch-size: ${AI_USER_THREAD_PLAN_MICRO_BATCH_SIZE:5}
    # WP4: ThreadQualityGate 통과 후 READY 운영 하한 (미달 → QUALITY_BELOW_MIN_ITEMS)
    ready-min-top-level: ${AI_USER_THREAD_PLAN_READY_MIN_TOP_LEVEL:3}
    ready-min-items: ${AI_USER_THREAD_PLAN_READY_MIN_ITEMS:6}
    stance-share-max: ${AI_USER_THREAD_PLAN_STANCE_SHARE_MAX:0.80}
    # ai_scheduled_posts 발행 스케줄러 (2026-07-31~, 새벽 배치가 만든 예약글을 슬롯 도래 시 발행)
    scheduled-post-publisher-enabled: ${AI_USER_SCHEDULED_POST_PUBLISHER_ENABLED:false}
    scheduled-post-publisher-cron: "${AI_USER_SCHEDULED_POST_PUBLISHER_CRON:0 * * * * *}"
    scheduled-post-publish-batch-size: ${AI_USER_SCHEDULED_POST_PUBLISH_BATCH_SIZE:5}
    post-slot-min-spacing-minutes: ${AI_USER_POST_SLOT_MIN_SPACING_MINUTES:45}
    # 좋아요·조회수 리콘실러 (2026-07-31~, 배포 시 enabled=false로 배포 후 백필 검증 후 true 전환)
    engagement:
      enabled: ${AI_USER_ENGAGEMENT_ENABLED:false}
      lookback-days: ${AI_USER_ENGAGEMENT_LOOKBACK_DAYS:3}
      max-posts-per-run: ${AI_USER_ENGAGEMENT_MAX_POSTS_PER_RUN:40}
      max-like-calls-per-run: ${AI_USER_ENGAGEMENT_MAX_LIKE_CALLS_PER_RUN:500}
      views-enabled: ${AI_USER_ENGAGEMENT_VIEWS_ENABLED:true}
      post-like-per-view: ${AI_USER_ENGAGEMENT_POST_LIKE_PER_VIEW:0.02}
      post-like-per-comment: ${AI_USER_ENGAGEMENT_POST_LIKE_PER_COMMENT:0.6}
      # comment/reply like: log1p(views)*coef (선형 views*0.025는 조회수 500+에서 전부 cap=12로 고정됨, 2026-08-01)
      comment-like-per-view: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_VIEW:0.75}
      comment-like-per-reply: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_PER_REPLY:1.0}
      comment-like-cap: ${AI_USER_ENGAGEMENT_COMMENT_LIKE_CAP:12}
      reply-like-per-view: ${AI_USER_ENGAGEMENT_REPLY_LIKE_PER_VIEW:0.40}
      reply-like-cap: ${AI_USER_ENGAGEMENT_REPLY_LIKE_CAP:5}
      persona-pool-size: ${AI_USER_ENGAGEMENT_PERSONA_POOL_SIZE:60}
      cold-login-budget: ${AI_USER_ENGAGEMENT_COLD_LOGIN_BUDGET:3}
      votes-enabled: ${AI_USER_ENGAGEMENT_VOTES_ENABLED:true}
      vote-per-view: ${AI_USER_ENGAGEMENT_VOTE_PER_VIEW:0.15}
      vote-cap: ${AI_USER_ENGAGEMENT_VOTE_CAP:80}
      max-vote-calls-per-run: ${AI_USER_ENGAGEMENT_MAX_VOTE_CALLS_PER_RUN:40}
      max-votes-per-post-per-run: ${AI_USER_ENGAGEMENT_MAX_VOTES_PER_POST_PER_RUN:8}
      vote-a-share-min: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MIN:0.44}
      vote-a-share-max: ${AI_USER_ENGAGEMENT_VOTE_A_SHARE_MAX:0.80}
      post-likes-enabled: ${AI_USER_ENGAGEMENT_POST_LIKES_ENABLED:true}
      engagement-cron: "${AI_USER_ENGAGEMENT_CRON:0 */5 * * * *}"

ai-learning:
  base-url: ${AI_LEARNING_BASE_URL:http://againspring-ai-learning:8099}
  enabled: ${AI_LEARNING_ENABLED:false}
  crawl:
    enabled: ${AI_LEARNING_CRAWL_ENABLED:false}

ai-user-ml:
  base-url: ${AI_USER_ML_BASE_URL:http://100.115.252.61:8201}
  api-token: ${AI_USER_ML_API_TOKEN:aiuser-ml-api-token-dev-2026}
  enabled: ${AI_USER_ML_ENABLED:false}
  collect: ${AI_USER_ML_COLLECT:false}
  best-of-n: ${AI_USER_ML_BEST_OF_N:4}
  timeout-ms: ${AI_USER_ML_TIMEOUT_MS:500}

logging:
  level:
    root: INFO
    com.againspring.aiuser.orchestrator: DEBUG
