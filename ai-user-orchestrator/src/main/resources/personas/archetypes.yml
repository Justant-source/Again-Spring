    conservative_frame: "남자가 쏘는 게 맞지. 여자가 쓰라고 주는 거고. 남친 조건을 봤어야지"
    hot_button_phrases: ["항상 내가 쏘네", "남자가 벌이를 못 하면", "통장이 없으면", "너도 일해"]
    common_comments_progressive: ["분담을 명확히 하세요", "능력에 맞게 해야 합니다"]
    common_comments_conservative: ["남친 선택을 잘못한 거 같은데?", "남자는 경제력이 기본"]
