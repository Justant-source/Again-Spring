# 갈등 장르 아키타입 라이브러리 — 한국 온라인 커뮤니티 기반 연구 (2026-06-03)
# 생성 방식: Nate판·블라인드·보배드림·여성 커뮤니티 패턴 분석 (실제 원문·실명·실제 사건 없음)
# 각 아키타입은 시나리오 골격 + 감정 비트 + 흔한 디테일 + 커뮤니티 출처 + 진보/보수 관점 포함

archetypes:

  # ========== COUPLE — 연인 갈등 (Nate판 주도) ==========

  - id: couple_communication
    category: COUPLE
    label: "연인 연락·카톡 갈등"
    scenario_skeleton: "연락 빈도·카톡 답장 속도·전화 통화 기대치 차이로 인한 갈등"
    emotional_beats: ["서운함", "답답함", "불안", "확인욕구"]
    common_details: ["야근 핑계", "친구 만남", "게임 시간", "읽씹"]
    community_origin: "Nate판 (TOP 1 갈등)"
    typical_poster_demographic: "20-30대 여성, 교제 1-3년"
    empathy_pattern: "상대방이 핑계대는지 정말 바쁜지 구분 공감, 불안감 이해"
    progressive_frame: "소통은 양방향. 상대방의 시간 존중도 필요하지만 최소 답장은 성의"
    conservative_frame: "일이 많으면 연락 못할 수 있음. 너무 예민하게 받아들이면 관계 피곤"
    hot_button_phrases: ["바빠서라는 핑계", "나도 바빠", "왜 자꾸 확인해", "불안한 건 아니니?"]
    common_comments_progressive: ["상대방이 당신을 우선순위에 두지 않는 것 같네요", "관계를 재검토해야 할 것 같습니다"]
    common_comments_conservative: ["남자들은 다 그래요", "이것도 싸움이 되나?", "먼저 연락해 보세요"]
    default_tier_weights: {HEAVY: 0.35, REGULAR: 0.45, LIGHT: 0.2}

  - id: couple_phone_control
    category: COUPLE
    label: "연인 휴대폰·연락처 통제"
    scenario_skeleton: "상대방이 휴대폰 확인, 위치 추적, 연락처 확인을 요구하거나 강요하는 갈등"
    emotional_beats: ["질식감", "분노", "배신감", "통제됨"]
    common_details: ["위치공유 강요", "휴대폰 비번 요구", "친구 관계 제한", "야밤 외출 의심"]
    community_origin: "여성 커뮤니티, Nate판 (관계 폭력 범주)"
    typical_poster_demographic: "20-30대 여성, 통제 경험자"
    empathy_pattern: "개인의 자유와 신뢰의 경계선 공감, 관계 폭력 인식"
    progressive_frame: "신뢰 없는 관계는 관계가 아님. 휴대폰 통제는 관계 폭력의 신호"
    conservative_frame: "남친이 관심 많아서 그런 거지, 심각할 건 아니다. 숨길 게 있으면 의심받지"
    hot_button_phrases: ["핸드폰 비번 알려줘", "지금 어디야?", "누구를 만나?", "투명해야 신뢰지"]
    common_comments_progressive: ["이건 통제예요, 헤어지세요", "관계 폭력입니다"]
    common_comments_conservative: ["그 정도면 괜찮은데?", "남자가 질리는 거네"]
    default_tier_weights: {HEAVY: 0.4, REGULAR: 0.4, LIGHT: 0.2}

  - id: couple_ex_comparison
    category: COUPLE
    label: "연인 전 연인 비교·언급"
    scenario_skeleton: "상대방이 내 전 친구/전 연인을 언급하거나 비교하여 상처 입는 갈등"
    emotional_beats: ["상처", "분노", "질투", "자존감 하락"]
    common_details: ["전 여친이 더 예쁘대", "전 남친은 이렇게 안 했는데", "그때가 낫지", "전 친구와 비교"]
    community_origin: "Nate판 (TOP 3)"
    typical_poster_demographic: "20-30대 (남·여), 교제 2-5년"
    empathy_pattern: "현재 관계에서 인정받지 못하는 상처 공감, 과거 비교의 상처 깊음"
    progressive_frame: "과거를 계속 언급하면 현재 관계에 해가 됨. 상대방을 있는 그대로 받아들여야"
    conservative_frame: "남자 입장에서 전 여친이 낫다고 했으면 왜 헤어졌나? 예민해하지 말자"
    hot_button_phrases: ["전 여친이 더 예뻤는데", "전 남친은 이래서 좋았어", "너는 왜", "그때 너는"]
    common_comments_progressive: ["그런 사람은 잊어버리세요", "당신이 최고입니다"]
    common_comments_conservative: ["남자는 그런 말 쉽게 하는 거고", "기혼자들은 더 심해"]
    default_tier_weights: {HEAVY: 0.35, REGULAR: 0.45, LIGHT: 0.2}

