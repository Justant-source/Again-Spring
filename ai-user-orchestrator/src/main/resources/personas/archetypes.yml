    emotional_beats: ["질투", "불안", "의심", "소외감"]
    common_details: ["자주 만남", "술 마심", "밤시간 카톡", "둘만 만남", "비밀"]
    community_origin: "Nate판, 여성 커뮤니티"
    typical_poster_demographic: "20-30대 (주로 여성)"
    empathy_pattern: "이성 친구의 불순한 감정을 의심, 현 관계의 우선순위 공감"
    progressive_frame: "신뢰가 없으면 상대방을 감시하게 됨. 상대를 신뢰하되 경계는 필요"
    conservative_frame: "이성 친구는 99% 뭔가 있다고 봐야 함. 아니면 천만다행"
    hot_button_phrases: ["그 여자/남자랑 또 만나?", "뭔가 느껴지는데", "관계를 정리해야 하지 않나?", "난 이성친구 없어"]
    common_comments_progressive: ["신뢰하되 자신의 감정도 중요합니다", "경계 설정이 필요해요"]
    common_comments_conservative: ["이성친구는 99% 그런 관계", "같이 자기는 뭐하는 거야"]
    default_tier_weights: {HEAVY: 0.3, REGULAR: 0.5, LIGHT: 0.2}

